<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
<meta name="theme-color" id="metaTheme" content="#f4f6fb">
<title>Passly — Gestor de Suscripciones y Cobros</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg: #f4f6fb;
  --sidebar-bg: #eef2ff;
  --surface: #ffffff;
  --surface-c: #f8fafc;
  --surface-high: #eef2f6;
  --surface-highest: #e2e8f0;
  --line: #e2e8f0;
  --line-subtle: #f1f5f9;
  --tx: #0f172a;
  --mu: #64748b;
  --primary: #2563eb;
  --primary-2: #7c3aed;
  --primary-container: rgba(37,99,235,0.10);
  --on-primary: #ffffff;
  --ok: #059669;
  --ok-bg: #dcfce7;
  --bad: #dc2626;
  --bad-bg: #fee2e2;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --mp: #009ee3;
  --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.07);
  --hero-grad: linear-gradient(135deg, rgba(37,99,235,0.12) 0%, rgba(124,58,237,0.10) 55%, var(--surface) 100%);
  color-scheme: light;
  box-sizing: border-box;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  padding-bottom:110px;
  transition:background .2s ease,color .2s ease;
}
body.landing-mode{padding-bottom:32px}
body.landing-mode main{max-width:760px;margin:0 auto;padding:14px 16px 36px}

/* LAYOUT SHELL ADMIN & CLIENTE */
.app-shell{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{
  display:none;
  width:248px;
  flex:none;
  background:var(--sidebar-bg);
  border-right:1px solid var(--line);
  padding:22px 14px;
  flex-direction:column;
  justify-content:space-between;
  position:sticky;
  top:0;
  height:100vh;
}
@media (min-width: 880px){
  body.admin-mode{padding-bottom:24px}
  .sidebar{display:flex}
  nav.mobile-nav{display:none !important}
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.sb-brand img{height:34px;border-radius:10px;object-fit:contain}
.sb-brand b{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--tx)}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sb-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;border:0;background:transparent;color:var(--mu);
  padding:11px 14px;border-radius:14px;
  font:600 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left;
  transition:all .15s ease;
}
.sb-item:hover{background:var(--primary-container);color:var(--tx)}
.sb-item.on{
  background:linear-gradient(90deg, var(--primary-container) 0%, rgba(124,58,237,0.08) 100%);
  color:var(--primary);font-weight:700;
}
.sb-item-left{display:flex;align-items:center;gap:11px}
.sb-pill-cnt{
  background:var(--primary-2);color:#fff;font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:9999px;min-width:22px;text-align:center;
}
.sb-foot{padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}

.workspace{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;
}
.tb-brand-mob{display:flex;align-items:center;gap:9px}
.tb-brand-mob img{height:32px;border-radius:9px}
.tb-brand-mob b{font-size:18px;font-weight:800;letter-spacing:-.4px}
@media (min-width: 880px){ .tb-brand-mob{display:none} }

.tb-search{flex:1;max-width:440px;position:relative;display:none}
@media (min-width: 600px){ .tb-search{display:block} }
.tb-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:18px;pointer-events:none}
.tb-search input{
  width:100%;background:var(--surface-c);border:1px solid var(--line);
  border-radius:9999px;padding:9px 16px 9px 40px;font-size:13px;color:var(--tx);
}

.tb-right{display:flex;align-items:center;gap:8px}
.icon-circle{
  position:relative;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface-c);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;transition:all .15s;
}
.icon-circle:active{transform:scale(.95)}
.icon-circle .dot{
  position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--primary-2);
}
.user-pill{
  display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;
  border-radius:9999px;border:1px solid var(--line);background:var(--surface-c);
  cursor:pointer;
}
.avatar-circle{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--primary-2));
  color:#fff;font:700 12px 'Plus Jakarta Sans',sans-serif;
  display:grid;place-items:center;
}
.user-pill-txt{display:none;text-align:left;line-height:1.15}
@media (min-width: 520px){ .user-pill-txt{display:block} }
.user-pill-txt b{display:block;font-size:12px;color:var(--tx)}
.user-pill-txt small{font-size:10px;color:var(--mu)}

.content-area{width:100%;max-width:980px;margin:0 auto;padding:20px 16px 28px}
body.client-mode .content-area{max-width:960px}

h1{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px;color:var(--tx)}
h2{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:20px 0 12px;color:var(--tx)}
p{margin:0;color:var(--mu);font-size:14px}

/* HERO & KPI CARDS V7 */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpi-grid-4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media (min-width: 720px){ .kpi-grid-4{grid-template-columns:repeat(4, 1fr);gap:14px;} }

.kpi-grid-3{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:22px}
@media (min-width: 640px){ .kpi-grid-3{grid-template-columns:repeat(3, 1fr);gap:14px;} }

.kpi-card{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.kpi-card.highlight{background:var(--hero-grad);border-color:rgba(37,99,235,0.25)}
.kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kpi-ico{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:grid;place-items:center;font-size:20px;
}
.kpi-ico.blue{background:rgba(37,99,235,0.12);color:#2563eb}
.kpi-ico.purple{background:rgba(124,58,237,0.12);color:#7c3aed}
.kpi-ico.green{background:rgba(5,150,105,0.12);color:#059669}
.kpi-ico.amber{background:rgba(217,119,6,0.12);color:#d97706}
.kpi-label{font-size:12px;font-weight:600;color:var(--mu)}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--tx);line-height:1.15}
.kpi-sub{margin-top:6px;font-size:12px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:6px}

/* CLIENT HERO WAVE */
.client-hero{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:26px;
  padding:24px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm);
}
.client-hero::after{
  content:'';position:absolute;right:-60px;top:-40px;width:300px;height:240px;
  background:radial-gradient(circle at 30% 40%, rgba(124,58,237,0.22), rgba(37,99,235,0.16) 55%, transparent 75%);
  border-radius:50%;pointer-events:none;
}
.client-kicker{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.client-nav-pills{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;
}
.client-nav-pills::-webkit-scrollbar{display:none}
.c-pill{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--mu);
  padding:9px 15px;border-radius:9999px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;
}
.c-pill.on{background:var(--primary-container);border-color:var(--primary);color:var(--primary);font-weight:700}

.subs-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:20px}
@media (min-width: 640px){ .subs-grid{grid-template-columns:repeat(2, 1fr);} }
@media (min-width: 880px){ .subs-grid{grid-template-columns:repeat(3, 1fr);} }

.sub-card{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;gap:12px;
}
.sub-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sub-card-title{font-size:17px;font-weight:800;color:var(--tx);margin:10px 0 2px}
.sub-card-meta{font-size:12px;color:var(--mu)}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:9999px}
.status-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.status-dot.ok{background:var(--ok-bg);color:var(--ok)}
.status-dot.bad{background:var(--bad-bg);color:var(--bad)}
.status-dot.warn{background:var(--warn-bg);color:var(--warn)}
.status-dot.info{background:var(--primary-container);color:var(--primary)}

.client-bottom-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width: 720px){ .client-bottom-grid{grid-template-columns:1.35fr 1fr;} }
.help-card{
  background:var(--hero-grad);border:1px solid var(--line);border-radius:24px;
  padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
}

/* BANNERS & CARDS */
.banner-alert{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);padding:14px 16px;border-radius:18px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.banner-warn{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);padding:14px 16px;border-radius:18px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.banner-info{background:var(--primary-container);border:1px solid var(--primary);color:var(--primary);padding:14px 16px;border-radius:18px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.banner-ok{background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok);padding:14px 16px;border-radius:18px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.notice-card{background:var(--surface);border:1px solid var(--primary);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}

.top-actions{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9999px;padding:11px 18px;font:700 13px 'Plus Jakarta Sans',sans-serif;background:var(--primary);color:var(--on-primary);cursor:pointer;transition:all .15s ease;text-decoration:none}
.btn:active{transform:scale(0.97);opacity:.9}
.btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.btn.g{background:var(--surface);color:var(--tx);border:1px solid var(--line)}
.btn.d{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.btn.w{background:#25d366;color:#032912}
.btn.mp{background:var(--mp);color:#fff}
.btn.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.btn.subtle{background:var(--surface);border:1px solid var(--line);color:var(--mu);padding:8px 14px;border-radius:9999px;font-size:13px}

.strip{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 8px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.strip div{text-align:center;border-right:1px solid var(--line-subtle);padding:0 4px}
.strip div:last-child{border:0}
.strip b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx)}
.strip small{color:var(--mu);font-size:12px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;position:relative;box-shadow:var(--shadow-sm)}
.card-header{display:flex;align-items:center;gap:12px}
.card-header .grow b{font-size:16px;font-weight:700}

.logo-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-subtle)}
.lg.xs{width:26px;height:26px;border-radius:8px;font-size:10px}

.subtabs{display:flex;gap:4px;background:var(--surface-c);padding:4px;border-radius:16px;margin:12px 0 16px;border:1px solid var(--line)}
.subtab{flex:1;border:0;background:transparent;color:var(--mu);font:600 12px 'Plus Jakarta Sans',sans-serif;padding:9px 4px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s ease}
.subtab.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}

.filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.f-pill{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--mu);border-radius:9999px;padding:7px 14px;font:600 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.f-pill.on{background:var(--primary-container);border-color:var(--primary);color:var(--primary)}

.search-box{position:relative;margin-bottom:12px}
.search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:18px;pointer-events:none}
.search-box input{padding-left:40px;border-radius:9999px;padding-top:10px;padding-bottom:10px;font-size:14px}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.row.paused{opacity:.65;border-style:dashed}
.grow{flex:1 1 100%;min-width:0;cursor:pointer;margin-bottom:4px}
@media (min-width: 540px){ .grow{flex:1;margin-bottom:0;} }
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;color:var(--tx)}
.grow small{color:var(--mu);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row-actions{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start}
@media (min-width: 540px){ .row-actions{width:auto;justify-content:flex-end;} }

.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:9999px;background:var(--surface-high);color:var(--mu);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--primary-container);color:var(--primary)}

.mini{border:1px solid var(--line);background:var(--surface-c);color:var(--tx);border-radius:9999px;padding:7px 12px;font:600 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.mini:active{transform:scale(0.96)}
.mini.d{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.mini.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.mini.primary{border-color:var(--primary);color:var(--on-primary);background:var(--primary)}

.add{width:100%;border:1px dashed var(--line);background:var(--surface-c);color:var(--primary);border-radius:16px;padding:12px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 20px;text-align:center;box-shadow:var(--shadow-sm)}
.empty p{margin-bottom:16px}

/* NAVEGACIÓN FLOTANTE MÓVIL */
nav.mobile-nav {
  position: fixed;left: 50%;transform: translateX(-50%);bottom: 18px;
  width: calc(100% - 24px);max-width: 420px;
  background: var(--surface);backdrop-filter: blur(16px);-webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);border-radius: 9999px;
  display: flex;justify-content: space-between;padding: 6px;z-index: 40;
  box-shadow: var(--shadow-md);
}
.nav-btn {
  display: flex;align-items: center;justify-content: center;gap: 5px;
  padding: 10px 12px;border-radius: 9999px;border: 0;background: transparent;
  color: var(--mu);font: 700 12px 'Plus Jakarta Sans', sans-serif;cursor: pointer;
  transition: all .2s ease;position:relative;
}
.nav-btn .txt { display: none; }
.nav-btn.on { background: var(--primary-container); color: var(--primary); }
.nav-btn.on .txt { display: block; color: var(--primary); }
.badge-dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

#sheet{position:fixed;inset:0;display:none;z-index:50}
#sheet.on{display:block}
.bk{position:absolute;inset:0;background:rgba(15,23,42,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pan{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:580px;max-height:90%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-md)}
@media (min-width: 640px){
  .pan{bottom:auto;top:50%;transform:translateY(-50%);border-radius:28px;max-height:86vh}
}

label{display:block;color:var(--mu);font-size:13px;font-weight:600;margin:14px 0 6px}
input,textarea,select{width:100%;background:var(--surface-c);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:15px 'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
input:disabled{opacity:.6}
textarea{height:100px;font:13px ui-monospace,monospace}
.inp-eye{display:flex;gap:8px;align-items:center}
.inp-eye input{flex:1}
.eye-btn{border:1px solid var(--line);background:var(--surface-c);color:var(--mu);border-radius:14px;width:46px;height:46px;flex:none;display:grid;place-items:center;cursor:pointer}
.acts{display:flex;gap:10px;margin-top:20px}
.acts .btn{flex:1}

.vault{background:var(--surface-c);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin:0 0 10px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.vr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vr code{font-family:ui-monospace,monospace;color:var(--primary);font-size:13px;word-break:break-all}
.lg{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 15px 'Plus Jakarta Sans',sans-serif;color:#fff;flex:none;object-fit:cover}
.lg.sm{width:34px;height:34px;border-radius:10px;font-size:13px}
.plat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb{display:flex;align-items:center;gap:8px;background:var(--surface-c);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:8px 10px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left}
.pb.on{border-color:var(--primary);background:var(--primary-container);color:var(--tx)}

function hexToRgb(hex){
  var h = String(hex || '#2563eb').replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  if (isNaN(n)) return { r: 37, g: 99, b: 235 };
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

  r.setProperty('--bad', pal.bad);
  r.setProperty('--bad-bg', pal.badBg);
  r.setProperty('--warn', pal.warn);
  r.setProperty('--warn-bg', pal.warnBg);
  r.setProperty('--shadow-sm', pal.shSm);

  r.setProperty('--primary', a);

  if (!obj || typeof obj !== 'object') obj = {};

/* FUNCIÓN esc() CORREGIDA PARA ESCAPAR &, <, >, " Y ' */
function esc(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function money(n){ return '$' + (+n||0).toLocaleString('es-MX', { maximumFractionDigits: 2 }); }
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function mk(d){ var m = d.getMonth() + 1; return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m; }
function fmt(d){ return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }); }
function fmtDT(ts){ if (!ts) return ''; return new Date(ts).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function monthLabel(mStr){ if (!mStr) return ''; var p = mStr.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('es-MX', { month: 'short' }); }
function monthLabelFull(mStr){ if (!mStr) return ''; var p = mStr.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }); }
function dueDate(y, m, day){ var last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(day, last)); }
function getMonthList(startM, endM){
  var res = []; if (!startM) return res;
  var s = startM.split('-').map(Number), e = endM.split('-').map(Number), y = s[0], m = s[1];
  while (y < e[0] || (y === e[0] && m <= e[1])) { res.push(y + '-' + (m < 10 ? '0' : '') + m); m++; if (m > 12) { m = 1; y++; } }
  return res;
}
function greetingTime(){
  var hr = new Date().getHours();
  if (hr < 12) return 'Buenos días';
  if (hr < 19) return 'Buenas tardes';
  return 'Buenas noches';
}
function initials(name){
  var parts = String(name || 'N').trim().split(/\s+/);
  return ((parts[0] ? parts[0][0] : '') + (parts[1] ? parts[1][0] : '')).toUpperCase() || 'N';
}

/* DETECTOR DE DISPOSITIVO Y REGISTRO DE LOGIN */
function detectDevice(){
  var ua = navigator.userAgent || '';
  var os = /Android/i.test(ua) ? 'Android' : (/iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Windows/i.test(ua) ? 'Windows' : (/Mac/i.test(ua) ? 'Mac' : 'Otro')));
  var br = /Edg/i.test(ua) ? 'Edge' : (/Chrome/i.test(ua) ? 'Chrome' : (/Safari/i.test(ua) ? 'Safari' : (/Firefox/i.test(ua) ? 'Firefox' : 'Navegador')));
  var isPwa = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  return os + ' • ' + br + (isPwa ? ' (PWA)' : '');
}
function recordLogin(user, role, displayName){
  if (!db || !user || LOGIN_LOGGED) return;
  LOGIN_LOGGED = true;
  db.collection('logins').add({
    uid: user.uid,
    email: user.email || '',
    name: displayName || (role === 'admin' ? 'Administrador' : (user.email || 'Cliente')),
    role: role,
    device: detectDevice(),
    at: Date.now()
  }).catch(function(e){ console.error('Login log error:', e); });
}

function openAuthModal(step){
  LOGIN_MODAL = true;
  LOGIN_STEP = step || 1;
  LOGIN_ERR = '';
  LOGIN_LOADING = false;
  renderLogin(true);
}

function closeAuthModal(){
  if (LOGIN_LOADING) return;
  LOGIN_MODAL = false;
  LOGIN_ERR = '';
  renderLogin(false);
}

function isValidEmailFormat(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
}

async function loginNext(){
  if (LOGIN_LOADING) return;
  var inp = $('#lgEmail');
  var e = (inp ? inp.value : LOGIN_EMAIL).trim().toLowerCase();
  if (!isValidEmailFormat(e)) {
    LOGIN_EMAIL = e;
    LOGIN_ERR = 'Escribe un correo electrónico válido (ej. usuario@dominio.com).';
    renderLogin(false);
    var el = $('#lgEmail'); if (el) { el.classList.add('shake'); el.focus(); }
    return;
  }
  LOGIN_EMAIL = e;
  LOGIN_ERR = '';
  LOGIN_LOADING = true;
  LOGIN_LOAD_TXT = 'Verificando correo...';
  renderLogin(false);

  try {
    if (FB_READY && auth) {
      var methods = await withTimeout(auth.fetchSignInMethodsForEmail(e), 4000);
      LOGIN_VERIFIED = !!(methods && methods.length > 0);
      LOGIN_STEP = 2;
    } else {
      LOGIN_VERIFIED = false;
      LOGIN_STEP = 2;
    }
  } catch (err) {
    if (err && err.code === 'auth/invalid-email') {
      LOGIN_ERR = 'El formato del correo electrónico no es válido.';
      LOGIN_STEP = 1;
    } else if (err && err.code === 'auth/user-not-found') {
      LOGIN_ERR = 'No encontramos una cuenta con este correo. Si tienes código, toca "Tengo un código".';
      LOGIN_STEP = 1;
    } else if (err && err.code === 'auth/too-many-requests') {
      LOGIN_ERR = 'Demasiados intentos seguidos. Espera un momento e intenta de nuevo.';
      LOGIN_STEP = 1;
    } else {
      LOGIN_VERIFIED = false;
      LOGIN_STEP = 2;
    }
  } finally {
    LOGIN_LOADING = false;
    LOGIN_LOAD_TXT = '';
    renderLogin(true);
  }
}

async function doLogin(){
  if (LOGIN_LOADING) return;
  var p = ($('#lgPass') ? $('#lgPass').value : '');
  if (!p) {
    LOGIN_ERR = 'Ingresa tu contraseña.';
    renderLogin(false);
    var el = $('#lgPass'); if (el) { el.classList.add('shake'); el.focus(); }
    return;
  }
  LOGIN_ERR = '';
  LOGIN_LOADING = true;
  LOGIN_LOAD_TXT = 'Iniciando sesión...';
  renderLogin(false);

  try {
    var cred = await auth.signInWithEmailAndPassword(LOGIN_EMAIL, p);
    LOGIN_ERR = '';
    if (cred && cred.user) {
      await handleUserSession(cred.user);
    }
  } catch (e) {
    LOGIN_LOADING = false;
    LOGIN_LOAD_TXT = '';
    if (e && (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential')) {
      LOGIN_ERR = 'Correo o contraseña incorrectos. Verifica tus datos o activa tu código.';
    } else if (e && e.code === 'auth/wrong-password') {
      LOGIN_ERR = 'Contraseña incorrecta. Intenta de nuevo o restablécela.';
    } else if (e && e.code === 'auth/too-many-requests') {
      LOGIN_ERR = 'Cuenta bloqueada temporalmente por varios intentos. Intenta más tarde.';
    } else {
      LOGIN_ERR = 'Error al entrar: ' + ((e && e.message) || 'revisa tu conexión');
    }
    renderLogin(true);
  }
}

async function doForgotPass(){
  if (!LOGIN_EMAIL || LOGIN_LOADING) return;
  LOGIN_LOADING = true;
  LOGIN_LOAD_TXT = 'Enviando enlace...';
  renderLogin(false);
  try {
    await auth.sendPasswordResetEmail(LOGIN_EMAIL);
    toast('Te enviamos un correo para restablecer tu contraseña');
  } catch (e) {
    toast('No se pudo enviar el correo de recuperación');
  } finally {
    LOGIN_LOADING = false;
    LOGIN_LOAD_TXT = '';
    renderLogin(false);
  }
}

async function doActivate(){
  if (LOGIN_LOADING) return;
  var code = ($('#actCode').value || '').trim().toUpperCase();
  var email = ($('#actEmail').value || '').trim().toLowerCase();
  var pass = ($('#actPass').value || '');
  if (!code || !isValidEmailFormat(email) || pass.length < 6) {
    LOGIN_ERR = 'Completa el código, un correo válido y contraseña de mínimo 6 caracteres.';
    renderLogin(false);
    return;
  }
  LOGIN_ERR = '';
  LOGIN_LOADING = true;
  LOGIN_LOAD_TXT = 'Activando cuenta...';
  renderLogin(false);

  try {
    var invDoc = await withTimeout(db.collection('invites').doc(code).get(), 6000);
    if (!invDoc.exists) {
      LOGIN_LOADING = false; LOGIN_ERR = 'Código de activación no encontrado.'; renderLogin(false); return;
    }
    var inv = invDoc.data();
    if (inv.used) {
      LOGIN_LOADING = false; LOGIN_ERR = 'Este código ya fue utilizado.'; renderLogin(false); return;
    }
    var cred = await auth.createUserWithEmailAndPassword(email, pass);
    var newUid = cred.user.uid;
    await db.collection('portal').doc(newUid).set(Object.assign({}, inv.portalData, { email: email, updatedAt: Date.now() }));
    await db.collection('invites').doc(code).update({ used: true, usedBy: newUid, usedEmail: email, usedAt: Date.now() });
    LOGIN_ERR = '';
    toast('¡Cuenta activada con éxito!');
    await handleUserSession(cred.user);
  } catch (e) {
    LOGIN_LOADING = false;
    LOGIN_LOAD_TXT = '';
    LOGIN_ERR = (e.code === 'auth/email-already-in-use') ? 'Ese correo ya está registrado. Inicia sesión.' : ('Error al activar: ' + (e.message || 'revisa tus datos'));
    renderLogin(false);
  }
}

function doLogout(){
  if (unsubReqs) { unsubReqs(); unsubReqs = null; }
  if (unsubNotices) { unsubNotices(); unsubNotices = null; }
  if (unsubInvites) { unsubInvites(); unsubInvites = null; }
  ACTIVE_SESSION_UID = null;
  LOGIN_LOGGED = false;
  LOGIN_LOADING = false;
  LOGIN_VERIFIED = false;
  LOGIN_MODAL = false;
  if (FB_READY && auth) auth.signOut();
  CUR_USER = null; USER_ROLE = null; PORTAL_DATA = null; LOGIN_STEP = 1; LOGIN_ERR = '';
  renderLogin(false);
}

function startClientNoticeListener(){
  if (unsubNotices) unsubNotices();
  noticesInitialized = false;
  unsubNotices = db.collection('notices').where('uid', '==', CUR_USER.uid).where('read', '==', false).onSnapshot(function(snap){
    var list = snap.docs.map(function(doc){ return Object.assign({ id: doc.id }, doc.data()); }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
    if (noticesInitialized && list.length > CLIENT_NOTICES.length) {
      var newest = list[0];
      fireLocalNotif('Passly: ' + (newest.title || 'Nuevo aviso'), newest.body || '');
    }
    CLIENT_NOTICES = list;
    noticesInitialized = true;
    if (USER_ROLE === 'client') renderClientPortal();
  }, function(e){ console.error(e); });
}

async function dismissNotice(id){
  try { await db.collection('notices').doc(id).update({ read: true, readAt: Date.now() }); toast('Aviso marcado como leído'); } catch(e){}
}

function askNotifPerm(){
  if (!('Notification' in window)) { toast('Tu navegador no soporta notificaciones'); return; }
  Notification.requestPermission().then(function(p){
    toast(p === 'granted' ? 'Notificaciones activadas' : 'Permiso denegado');
    if (USER_ROLE === 'client') renderClientPortal(); else render();
  });
}
async function saveClientPhone(){
  var ph = ($('#cpPhone').value || '').replace(/\D/g, '');
  try {
    await db.collection('portal').doc(CUR_USER.uid).update({ phone: ph, phoneUpdatedAt: Date.now() });
    PORTAL_DATA.phone = ph; toast('WhatsApp actualizado');
  } catch (e) { toast('Error al actualizar'); }
}
async function changeClientPass(){
  var np = ($('#cpNewPw').value || ''); if (np.length < 6) { toast('Mínimo 6 caracteres'); return; }
  try { await CUR_USER.updatePassword(np); $('#cpNewPw').value = ''; toast('Contraseña actualizada'); }
  catch (e) { toast('Por seguridad, cierra sesión y vuelve a entrar para cambiar tu contraseña.'); }
}
function toggleClientPw(idx, encPw){ var el = $('#cpw-' + idx); if (!el) return; if (el.dataset.v) { el.textContent = '••••••••'; delete el.dataset.v; } else { el.textContent = decodeURIComponent(encPw); el.dataset.v = '1'; } }

async function submitPaymentReport(){

function openRequestService(cid, name, price){
  openS('<h2>Solicitar ' + esc(name) + '</h2><p>Mensualidad estimada: <b>' + money(price) + '</b>. El administrador revisará tu solicitud y te contactará para activar el acceso.</p>' +
    '<label>Nombre de perfil deseado o nota (opcional)</label><input id="rsNote" placeholder="Ej. Perfil Juan, PIN 1234">' +

async function submitServiceReq(cid, name, price){
  var note = ($('#rsNote').value || '').trim();
  try {
    await db.collection('requests').add({ type: 'service', status: 'pending', uid: CUR_USER.uid, clientName: PORTAL_DATA.name, accountId: cid, serviceName: name, price: price, note: note, createdAt: Date.now() });
    closeS(); toast('Solicitud enviada al administrador');
    await loadClientReqs(); renderClientPortal();
  } catch (e) { toast('Error al enviar solicitud'); }

async function loadClientReqs(){
  if (!CUR_USER || !db) return;
  try {
    var snap = await withTimeout(db.collection('requests').where('uid', '==', CUR_USER.uid).get(), 4500);
    CLIENT_REQS = snap.docs.map(function(doc){ return Object.assign({ id: doc.id }, doc.data()); }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  } catch (e) { CLIENT_REQS = []; }
}

function startAdminInviteListener(){
  if (unsubInvites) unsubInvites();
  invitesInitialized = false;
  unsubInvites = db.collection('invites').where('used', '==', true).onSnapshot(function(snap){
    var changed = false;
    snap.docChanges().forEach(function(chg){
      var inv = chg.doc.data();
      if (inv.clientKey && inv.usedBy && S.portalMap[inv.clientKey] !== inv.usedBy) {
        S.portalMap[inv.clientKey] = inv.usedBy;
        if (inv.usedEmail) S.clientEmails[inv.clientKey] = inv.usedEmail;
        changed = true;
        if (invitesInitialized) {
          RECENT_ACTIVATIONS.unshift({ id: chg.doc.id, name: inv.clientName || inv.clientKey, email: inv.usedEmail || '', at: inv.usedAt || Date.now() });
          fireLocalNotif('Passly: Código activado', (inv.clientName || 'Un cliente') + ' ya activó su portal.');
          toast((inv.clientName || 'Cliente') + ' activó su código');
        }
      }
    });
    invitesInitialized = true;
    if (changed) { save(); render(); }
  }, function(e){ console.error(e); });
}

function dismissActivation(id){
  RECENT_ACTIVATIONS = RECENT_ACTIVATIONS.filter(function(x){ return x.id !== id; });
  render();
}

async function openLoginHistory(){
  openS('<h2><i class="icon" style="color:var(--primary)">devices</i> Dispositivos con login</h2><p>Cargando historial...</p>');
  try {
    var snap = await withTimeout(db.collection('logins').orderBy('at', 'desc').limit(40).get(), 5000);
    var logs = snap.docs.map(function(doc){ return Object.assign({ id: doc.id }, doc.data()); });
    window._LOGS = logs;
    renderLoginHistory('all');
  } catch (e) {
    openS('<h2>Dispositivos con login</h2><p style="color:var(--bad)">Error al cargar. Verifica las reglas de Firestore (/logins).</p><div class="acts"><button class="btn g" onclick="closeS()">Cerrar</button></div>');
  }
}

function renderLoginHistory(filter){
  var logs = (window._LOGS || []).filter(function(l){
    if (filter === 'admin') return l.role === 'admin';
    if (filter === 'client') return l.role !== 'admin';
    return true;
  });
  var rows = !logs.length ? '<div class="empty"><p>Sin registros en esta categoría.</p></div>' : logs.map(function(l){
    var isAdm = l.role === 'admin';
    return '<div class="row">' +
      '<i class="icon" style="color:' + (isAdm ? 'var(--primary)' : 'var(--ok)') + ';font-size:24px">' + (isAdm ? 'admin_panel_settings' : 'smartphone') + '</i>' +
      '<div class="grow"><b>' + esc(l.name || l.email) + '</b><small><span>' + esc(l.device || 'Dispositivo') + '</span><span>' + fmtDT(l.at) + '</span></small></div>' +
      '<span class="chip ' + (isAdm ? 'info' : 'ok') + '">' + (isAdm ? 'Admin' : 'Cliente') + '</span>' +
    '</div>';
  }).join('');

  openS('<h2><i class="icon" style="color:var(--primary)">devices</i> Dispositivos con login</h2>' +
    '<div class="subtabs">' +
      '<button class="subtab ' + (filter === 'all' ? 'on' : '') + '" onclick="renderLoginHistory(\'all\')">Todos</button>' +
      '<button class="subtab ' + (filter === 'admin' ? 'on' : '') + '" onclick="renderLoginHistory(\'admin\')">Míos (Admin)</button>' +
      '<button class="subtab ' + (filter === 'client' ? 'on' : '') + '" onclick="renderLoginHistory(\'client\')">Clientes</button>' +
    '</div>' + rows +
    '<div class="acts"><button class="btn g" onclick="closeS()">Cerrar</button></div>');
}

async function sendNoticeToUid(targetUid, title, body, clientEmail){
  if (!targetUid || !db) return;
  await db.collection('notices').add({ uid: targetUid, title: title, body: body, read: false, createdAt: Date.now() });
  var s = S.settings || {};
  if (s.ejsService && s.ejsTemplate && s.ejsKey && clientEmail) {
    fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service_id: s.ejsService, template_id: s.ejsTemplate, user_id: s.ejsKey, template_params: { to_email: clientEmail, title: title, message: body } })
    }).catch(function(){});
  }
}

function openSendNotice(mode, id){
  var label = mode === 'acc' ? ('Todos en ' + esc(findAcc(id).name)) : esc(CL[id].name);
  openS('<h2>Enviar aviso — ' + label + '</h2>' +
    '<label>Plantilla rápida</label><select id="ntTpl" onchange="fillNoticeTpl(\'' + mode + '\',\'' + id + '\')">' +
      '<option value="custom">Mensaje personalizado</option>' +
      '<option value="logout">Aviso de cierre de sesiones</option>' +
      '<option value="pw">Aviso de cambio de contraseña</option>' +
      '<option value="pay">Recordatorio de pago pendiente</option>' +
    '</select>' +
    '<label>Título del aviso</label><input id="ntTitle" placeholder="Ej. Aviso importante">' +
    '<label>Mensaje</label><textarea id="ntBody" placeholder="Escribe el mensaje que verá el cliente en su portal..."></textarea>' +
    '<div class="acts"><button class="btn g" onclick="closeS()">Cancelar</button><button class="btn" onclick="execSendNotice(\'' + mode + '\',\'' + id + '\')"><i class="icon">send</i> Enviar aviso</button></div>');
}
function fillNoticeTpl(mode, id){
  var tpl = $('#ntTpl').value, svc = mode === 'acc' ? findAcc(id).name : 'tus servicios';
  if (tpl === 'logout') { $('#ntTitle').value = 'Cierre de sesiones — ' + svc; $('#ntBody').value = 'Por seguridad y mantenimiento se cerrarán las sesiones activas en ' + svc + '. Por favor vuelve a iniciar sesión con los datos disponibles en tu portal.'; }
  else if (tpl === 'pw') { $('#ntTitle').value = 'Nueva contraseña — ' + svc; $('#ntBody').value = 'Se actualizó la contraseña de acceso para ' + svc + '. Ya puedes consultarla y copiarla en tu pestaña de Servicios.'; }
  else if (tpl === 'pay') { $('#ntTitle').value = 'Recordatorio de pago'; $('#ntBody').value = 'Te recordamos que tienes un pago pendiente o próximo a vencer. Puedes consultar el monto y reportar tu pago desde la pestaña Pagos.'; }
}
async function execSendNotice(mode, id){
  var title = ($('#ntTitle').value || '').trim(), body = ($('#ntBody').value || '').trim();
  if (!title || !body) { toast('Completa título y mensaje'); return; }
  var count = 0;
  if (mode === 'acc') {
    var c = findAcc(id);
    for (var i = 0; i < c.users.length; i++) {
      var k = c.users[i].name.trim().toLowerCase(), uUid = S.portalMap[k];
      if (uUid) { await sendNoticeToUid(uUid, title, body, S.clientEmails[k]); count++; }
    }
  } else {
    var g = CL[id], k = g.name.toLowerCase(), uUid = S.portalMap[k];
    if (uUid) { await sendNoticeToUid(uUid, title, body, S.clientEmails[k]); count = 1; }
  }
  closeS();
  toast(count ? ('Aviso enviado a ' + count + ' portal(es)') : 'Ningún cliente tiene portal activo aún');
}

async function approvePaymentReq(reqId){
  var r = ADMIN_REQS.find(function(x){ return x.id === reqId; }); if (!r) return;
  var curM = mk(today()), key = (r.clientName || '').trim().toLowerCase();
  S.accounts.forEach(function(c){
    c.users.forEach(function(u){
      if (u.name.trim().toLowerCase() === key && !u.paused) {
        var deb = getDebt(u);
        if (!Array.isArray(u.paidMonths)) u.paidMonths = [];
        deb.unpaid.forEach(function(m){ if (u.paidMonths.indexOf(m) === -1) u.paidMonths.push(m); });
        if (u.paidMonths.indexOf(curM) === -1) u.paidMonths.push(curM);
      }
    });
  });
  save();
  await db.collection('requests').doc(reqId).update({ status: 'approved', resolvedAt: Date.now() });
  await refreshClientPortalSafe(key, r.uid);
  await sendNoticeToUid(r.uid, 'Pago verificado', 'Tu pago de ' + money(r.amount) + ' fue verificado con éxito. ¡Gracias!', S.clientEmails[key]);
  toast('Pago verificado y portal actualizado');
  render();
}
async function approveServiceReq(reqId){
  var r = ADMIN_REQS.find(function(x){ return x.id === reqId; }); if (!r) return;
  await db.collection('requests').doc(reqId).update({ status: 'approved', resolvedAt: Date.now() });
  toast('Solicitud aprobada. Agrega su perfil y republica su portal.');

async function resolveReq(reqId, st){ await db.collection('requests').doc(reqId).update({ status: st, resolvedAt: Date.now() }); toast('Solicitud rechazada'); }

async function refreshClientPortalSafe(clientKey, clientUid, updatedAccId, newPlainPw){
  if (!clientUid || !db) return;
  buildClientList();
  var g = CL.find(function(x){ return x.name.toLowerCase() === clientKey; });
  if (!g) return;
  var d = cliData(g);
  try {
    var prev = await db.collection('portal').doc(clientUid).get();
    if (prev.exists && prev.data().rows) {
      var prevRows = prev.data().rows;
      d.rows.forEach(function(row){
        if (updatedAccId && row.cid === updatedAccId && newPlainPw) { row.pw = newPlainPw; }
        else { var match = prevRows.find(function(pr){ return pr.cid === row.cid && pr.pw; }); if (match) row.pw = match.pw; }
      });
    }
    await db.collection('portal').doc(clientUid).set(Object.assign({}, d, { updatedAt: Date.now() }));
  } catch (e) { console.error(e); }
}

function getDebt(u){
  var t = today(), curM = mk(t), start = u.startMonth || curM;
  var paid = Array.isArray(u.paidMonths) ? u.paidMonths : (u.paidFor ? [u.paidFor] : []);
  if (u.paused) return { paused: true, unpaid: [], count: 0, debt: 0, isCurPaid: paid.indexOf(curM) !== -1, nextD: null, paidMonths: paid };
  var list = getMonthList(start, curM), unpaid = [];
  list.forEach(function(m){ if (paid.indexOf(m) === -1) { if (m < curM) unpaid.push(m); else if (m === curM && t.getDate() > (u.day || 1)) unpaid.push(m); } });
  var isCurPaid = paid.indexOf(curM) !== -1;
  var targetM = isCurPaid ? (function(){ var p = curM.split('-').map(Number), y = p[0], m = p[1] + 1; if (m > 12) { m = 1; y++; } return y + '-' + (m < 10 ? '0' : '') + m; })() : curM;
  var pTarget = targetM.split('-').map(Number);
  return { paused: false, unpaid: unpaid, count: unpaid.length, debt: unpaid.length * (+u.amount || 0), isCurPaid: isCurPaid, nextD: dueDate(pTarget[0], pTarget[1] - 1, u.day || 1), paidMonths: paid };
}

function getBillingInfo(u){
  var deb = getDebt(u), t = today(), curM = mk(t), amt = +u.amount || 0;
  if (u.paused) return { deb: deb, pastMonths: [], pastDebt: 0, curDue: 0, totalPay: 0, statusText: 'Servicio pausado', shortStatus: 'Pausado', badgeCls: 'warn', nextCycleText: 'Pausado', isUpToDate: true };
  var pastMonths = deb.unpaid.filter(function(m){ return m < curM; }), pastDebt = pastMonths.length * amt, curDue = deb.isCurPaid ? 0 : amt, totalPay = pastDebt + curDue;
  var nextDateStr = deb.nextD ? fmt(deb.nextD) : '', diff = deb.nextD ? Math.round((deb.nextD - t) / 864e5) : 0;
  var statusText = '', shortStatus = '', badgeCls = 'ok';
  if (deb.isCurPaid && pastMonths.length === 0) { statusText = 'Al corriente — Siguiente ciclo: ' + nextDateStr; shortStatus = 'Próx. ' + nextDateStr; badgeCls = 'ok'; }
  else if (pastMonths.length > 0 && curDue > 0) { statusText = 'Adeudo anterior (' + pastMonths.map(monthLabel).join(', ') + ') + Ciclo actual'; shortStatus = 'Debe ' + (pastMonths.length + 1) + ' m'; badgeCls = 'bad'; }
  else if (pastMonths.length > 0) { statusText = 'Adeudo anterior (' + pastMonths.map(monthLabel).join(', ') + ')'; shortStatus = 'Debe ' + pastMonths.length + ' m'; badgeCls = 'bad'; }
  else {
    if (diff < 0) { statusText = 'Ciclo actual vencido (corte ' + nextDateStr + ')'; shortStatus = 'Vencido'; badgeCls = 'bad'; }
    else if (diff === 0) { statusText = 'Fecha de pago hoy (' + nextDateStr + ')'; shortStatus = 'Cobra hoy'; badgeCls = 'warn'; }
    else { statusText = 'Siguiente ciclo: ' + nextDateStr + ' (en ' + diff + ' días)'; shortStatus = 'Corte ' + nextDateStr; badgeCls = diff <= 3 ? 'warn' : ''; }
  }
  return { deb: deb, pastMonths: pastMonths, pastDebt: pastDebt, curDue: curDue, totalPay: totalPay, statusText: statusText, shortStatus: shortStatus, badgeCls: badgeCls, nextCycleText: nextDateStr, isUpToDate: (totalPay === 0) };
}

function userChip(deb, u){
  if (u.paused) return '<span class="chip warn">Pausado</span>';
  if (deb.count > 0) return '<span class="chip bad">Debe ' + deb.count + 'm</span>';
  if (deb.isCurPaid) return '<span class="chip ok">Al corriente</span>';
  var diff = Math.round((deb.nextD - today()) / 864e5);
  return diff === 0 ? '<span class="chip warn">Cobra hoy</span>' : '<span class="chip ' + (diff <= 3 ? 'warn' : '') + '">En ' + diff + ' d</span>';
}

var KEY_CRYPTO = null, pend = null, TK = '', TB = '';
function b64(u){ return btoa(String.fromCharCode.apply(null, u)); }
function ub(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

async function enc(t){ var iv = crypto.getRandomValues(new Uint8Array(12)), c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, KEY_CRYPTO, new TextEncoder().encode(t)); return b64(iv) + '.' + b64(new Uint8Array(c)); }
async function dec(s){ var p = s.split('.'), d = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(p[0]) }, KEY_CRYPTO, ub(p[1])); return new TextDecoder().decode(d); }

}
async function doUnlock(){
  var p = $('#mf1').value; if (!p) { say('Escribe tu clave.'); return; }
  try {
    if (!S.vault) { if (p.length < 6 || p !== $('#mf2').value) { say('Mínimo 6 caracteres y repítela igual.'); return; } var salt = b64(crypto.getRandomValues(new Uint8Array(16))); KEY_CRYPTO = await derive(p, salt); S.vault = { salt: salt, check: await enc('ok') }; save(); }
    else { KEY_CRYPTO = await derive(p, S.vault.salt); if (await dec(S.vault.check) !== 'ok') throw 0; }

}

var PLAT = [['netflix','Netflix','#e50914','N'],['hbo','Max','#002be7','max'],['prime','Prime Video','#00a8e1','prime'],['disney','Disney+','#113ccf','D+'],['spotify','Spotify','#1db954','S'],['youtube','YouTube','#ff0033','▶'],['apple','Apple TV+','#2c2c31','tv+'],['paramount','Paramount+','#0064ff','P+'],['crunchy','Crunchyroll','#f47521','CR'],['vix','ViX','#ff6a00','ViX'],['canva','Canva','#00a7b0','C'],['google','Google One','#4285f4','1']];
function brand(l, n){ for (var i = 0; i < PLAT.length; i++) if (PLAT[i][0] === l) return { c: PLAT[i][2], t: PLAT[i][3] }; return { c: '#334155', t: (String(n||'?').trim().charAt(0).toUpperCase() || '?') }; }
function badge(c, sz){
  var cls = sz === 2 ? 'lg xs' : (sz === 1 ? 'lg sm' : 'lg');
  var l = c.logo || '';
  if (l.indexOf('data:') === 0) return '<img class="' + cls + '" src="' + l + '" alt="">';
  var b = brand(l, c.name);
  return '<span class="' + cls + '" style="background:' + b.c + '">' + esc(b.t) + '</span>';
}
function platPicker(){ var h = '<div class="plat">'; PLAT.forEach(function(p){ h += '<button type="button" class="pb' + (SEL === p[0] ? ' on' : '') + '" onclick="pickP(\'' + p[0] + '\')"><span class="lg sm" style="background:' + p[2] + '">' + esc(p[3]) + '</span>' + esc(p[1]) + '</button>'; }); return h + '</div><div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="mini" onclick="document.getElementById(\'lf\').click()">Subir logo</button><button type="button" class="mini" onclick="pickP(\'\')">Quitar</button><input id="lf" type="file" accept="image/*" style="display:none" onchange="upLogo(this)"></div>'; }
function pickP(k){ SEL = k; var btns = document.querySelectorAll('.plat .pb'); for (var i = 0; i < btns.length; i++) btns[i].className = 'pb' + (PLAT[i][0] === k ? ' on' : ''); }
function upLogo(inp){ var f = inp.files && inp.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(){ var im = new Image(); im.onload = function(){ var c = document.createElement('canvas'); c.width = c.height = 96; var x = c.getContext('2d'), m = Math.min(im.width, im.height); x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, 96, 96); pickP(c.toDataURL('image/png')); toast('Logo listo'); }; im.src = r.result; }; r.readAsDataURL(f); }
function modeSw(){ var c = $('#cred'); if (c) c.style.display = $('#f12').value === 'fam' ? 'none' : ''; }

/* =========================================================
   ARRANQUE Y MANEJO DE SESIÓN SIN BLOQUEO EN MÓVIL
   ========================================================= */
async function handleUserSession(user){
  if (!user) return;
  if (ACTIVE_SESSION_UID === user.uid && USER_ROLE) return;
  ACTIVE_SESSION_UID = user.uid;
  CUR_USER = user;
  LOGIN_LOADING = false;
  LOGIN_MODAL = false;

  if (user.uid === ADMIN_UID) {
    USER_ROLE = 'admin';
    S = sanitizeState(S);
    applyTheme();
    render();
    recordLogin(user, 'admin', 'Administrador');
    try {
      var doc = await withTimeout(db.collection('admin').doc('datos').get(), 6000);
      if (doc.exists) {
        S = sanitizeState(doc.data());
        applyTheme();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
        render();
      } else if (S.accounts && S.accounts.length) {
        save();
      }
    } catch (e) { console.error('Admin sync load:', e); }
    try {
      syncCatalog();
      startAdminInviteListener();
      startAdminReqListener();
    } catch (e) { console.error(e); }
  } else {
    USER_ROLE = 'client';
    document.body.className = 'client-mode';
    $('#mainNav').style.display = 'none';
    $('#app').innerHTML = '<div class="content-area"><div class="card" style="text-align:center;padding:44px 20px"><div class="spinner lg-spin" style="margin:0 auto 14px"></div><h2 style="margin:0 0 6px">Cargando tu portal...</h2><p>Obteniendo tus servicios y estado de cuenta</p></div></div>';
    try {
      var results = await Promise.all([
        withTimeout(db.collection('portal').doc(user.uid).get(), 6000).catch(function(){ return null; }),
        withTimeout(db.collection('catalog').doc('public').get(), 6000).catch(function(){ return null; }),
        loadClientReqs()
      ]);
      var pdoc = results[0], cdoc = results[1];
      PORTAL_DATA = (pdoc && pdoc.exists) ? pdoc.data() : null;
      CATALOG_DATA = (cdoc && cdoc.exists && cdoc.data().items) ? cdoc.data().items : [];
      recordLogin(user, 'client', PORTAL_DATA ? PORTAL_DATA.name : user.email);
      startClientNoticeListener();
    } catch (e) { PORTAL_DATA = null; }
    renderClientPortal();
  }
}

renderLogin(false);

if (FB_READY && auth) {
  auth.onAuthStateChanged(function(user){
    if (!user) {
      ACTIVE_SESSION_UID = null;
      CUR_USER = null;
      USER_ROLE = null;
      LOGIN_LOGGED = false;
      LOGIN_LOADING = false;
      renderLogin(false);
      return;
    }
    handleUserSession(user);
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
