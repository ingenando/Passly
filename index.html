<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Passly — Gestor de Cobros</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #000000;
  --surface: #0a0a0a;
  --surface-c: #121212;
  --surface-high: #1a1a1a;
  --surface-highest: #242424;
  --line: #222222;
  --line-subtle: #171717;
  --tx: #f8fafc;
  --mu: #8e8e93;
  --primary: #38bdf8;
  --primary-hover: #0ea5e9;
  --primary-container: #082f49;
  --on-primary: #000000;
  --on-primary-container: #bae6fd;
  --ok: #34d399;
  --ok-bg: #064e3b;
  --bad: #f87171;
  --bad-bg: #450a0a;
  --warn: #fbbf24;
  --warn-bg: #451a03;
  color-scheme: dark;
  box-sizing: border-box;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  padding-bottom:120px; /* Espacio para la barra flotante */
}
main{max-width:580px;margin:0 auto;padding:16px 16px 24px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:8px 0 4px;color:#fff}
h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:24px 0 12px;color:#fff}
p{margin:0;color:var(--mu);font-size:14px}
.banner-alert{background:var(--bad-bg);border:1px solid var(--bad);color:#fecaca;padding:12px 16px;border-radius:18px;font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.top-actions{display:flex;gap:10px;margin:18px 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9999px;padding:13px 20px;font:700 14px 'Plus Jakarta Sans',sans-serif;background:var(--primary);color:var(--on-primary);cursor:pointer;transition:all .15s ease}
.btn:active{transform:scale(0.97);opacity:.9}
.btn.g{background:var(--surface-high);color:var(--tx);border:1px solid var(--line)}
.btn.d{background:var(--bad-bg);color:var(--bad);border:1px solid #7f1d1d}
.btn.w{background:#25d366;color:#032912}
.btn.subtle{background:transparent;border:1px solid var(--line);color:var(--mu);padding:8px 14px;border-radius:9999px;font-size:13px}
.btn.subtle.d{border-color:#7f1d1d;color:var(--bad)}

.strip{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-c);border:1px solid var(--line-subtle);border-radius:24px;padding:16px 8px;margin-bottom:20px}
.strip div{text-align:center;border-right:1px solid var(--line-subtle);padding:0 4px}
.strip div:last-child{border:0}
.strip b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.strip small{color:var(--mu);font-size:12px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:16px;position:relative}
.card-header{display:flex;align-items:center;gap:12px}
.card-header .grow b{font-size:17px;font-weight:700}
.subtabs{display:flex;gap:6px;background:var(--surface-c);padding:4px;border-radius:16px;margin:12px 0 14px;border:1px solid var(--line-subtle)}
.subtab{flex:1;border:0;background:transparent;color:var(--mu);font:600 12px 'Plus Jakarta Sans',sans-serif;padding:8px 4px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s ease}
.subtab.on{background:var(--surface-high);color:var(--primary);border:1px solid var(--line)}

/* CSS CORREGIDO PARA FILAS Y BOTONES (Versión 3.1) */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface-c);border:1px solid var(--line-subtle);border-radius:18px;padding:12px;margin-bottom:8px}
.row.paused{opacity:.65;border-style:dashed}
.grow{flex:1 1 100%;min-width:0;cursor:pointer;margin-bottom:4px}
@media (min-width: 480px){ .grow{flex:1;margin-bottom:0;} }
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.grow small{color:var(--mu);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row-actions{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start}
@media (min-width: 480px){ .row-actions{width:auto;justify-content:flex-end;} }

.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:9999px;background:var(--surface-high);color:var(--mu);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

.mini{border:1px solid var(--line);background:var(--surface-high);color:var(--tx);border-radius:9999px;padding:7px 12px;font:600 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer;white-space:nowrap}
.mini:active{transform:scale(0.96)}
.mini.d{border-color:#7f1d1d;color:var(--bad);background:var(--bad-bg)}
.mini.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.mini.primary{border-color:var(--primary);color:var(--on-primary);background:var(--primary)}

.add{width:100%;border:1px dashed var(--line);background:var(--surface-c);color:var(--primary);border-radius:16px;padding:12px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 20px;text-align:center}
.empty p{margin-bottom:16px}

/* NUEVA BARRA DE NAVEGACIÓN FLOTANTE (Pill-shaped) */
nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 24px;
  width: calc(100% - 32px);
  max-width: 360px;
  background: rgba(18, 18, 18, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: 9999px;
  display: flex;
  justify-content: space-between;
  padding: 6px;
  z-index: 40;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.nav-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 9999px;
  border: 0;
  background: transparent;
  color: var(--mu);
  font: 700 14px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-btn .txt { display: none; }
.nav-btn.on { background: var(--primary-container); color: var(--primary); }
.nav-btn.on .txt { display: block; color: var(--primary); }
.nav-btn.on .icon { color: var(--primary); }

#sheet{position:fixed;inset:0;display:none;z-index:50}
#sheet.on{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px)}
.pan{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:580px;max-height:90%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}

label{display:block;color:var(--mu);font-size:13px;font-weight:600;margin:14px 0 6px}
input,textarea,select{width:100%;background:var(--surface-c);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:13px 14px;font:15px 'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{height:130px;font:12px ui-monospace,monospace}
.acts{display:flex;gap:10px;margin-top:20px}
.acts .btn{flex:1}

.vault{background:var(--surface-c);border:1px solid var(--line-subtle);border-radius:18px;padding:12px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.vr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vr code{font-family:ui-monospace,monospace;color:var(--primary);font-size:14px}
.lg{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 15px 'Plus Jakarta Sans',sans-serif;color:#fff;flex:none;object-fit:cover}
.lg.sm{width:34px;height:34px;border-radius:10px;font-size:13px}
.plat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb{display:flex;align-items:center;gap:8px;background:var(--surface-c);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:8px 10px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left}
.pb.on{border-color:var(--primary);background:var(--primary-container);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--surface-highest);color:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:9999px;z-index:90;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:14px;cursor:pointer}
.chk input{width:auto}
.tkc{background:var(--surface-c);border:1px solid var(--line);border-radius:22px;padding:8px 16px;margin:14px 0 8px}
.tr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-subtle)}
.tr:last-child{border:0}
.ta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tt{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.tt span{color:var(--mu);font-size:14px}
.tt b{font-size:18px;font-variant-numeric:tabular-nums;color:#fff}
.icon{font-family:'Material Symbols Rounded',sans-serif;font-style:normal;vertical-align:middle;line-height:1}

.top-logo-container { display:flex; justify-content:center; align-items:center; padding: 8px 0 24px; }
.top-logo-img { height: 48px; border-radius: 12px; object-fit: contain; }
</style>
</head>
<body>
<div id="storageAlert"></div>
<main id="app"></main>
<nav>
<button class="nav-btn" id="n1" onclick="go('home')"><i class="icon">home</i><span class="txt">Inicio</span></button>
<button class="nav-btn" id="n2" onclick="go('accts')"><i class="icon">dataset</i><span class="txt">Cuentas</span></button>
<button class="nav-btn" id="n3" onclick="go('clients')"><i class="icon">group</i><span class="txt">Clientes</span></button>
<button class="nav-btn" id="n4" onclick="go('sets')"><i class="icon">settings</i><span class="txt">Ajustes</span></button>
</nav>
<div id="sheet"></div>

<script>
var KEY = 'subs-v1', S = { accounts: [], settings: {}, lastBackup: null }, view = 'home';
var ACC_EXP = {}, ACC_TAB = {};

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});

function testStorage() {
  try { localStorage.setItem('__ptest', '1'); localStorage.removeItem('__ptest'); return true; } 
  catch(e) { return false; }
}
if (!testStorage()) {
  document.getElementById('storageAlert').innerHTML = '<div class="banner-alert" style="margin:12px 16px 0"><i class="icon">error</i> Tus datos no se están guardando. Desactiva modo incógnito.</div>';
}

try { var raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch(e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

var $ = function(s){ return document.querySelector(s); };
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function money(n){ return '$' + (+n||0).toLocaleString('es-MX', { maximumFractionDigits: 2 }); }
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function mk(d){ var m = d.getMonth() + 1; return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m; }
function fmt(d){ return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }); }
function monthLabel(mStr){
  if (!mStr) return '';
  var p = mStr.split('-').map(Number);
  var d = new Date(p[0], p[1] - 1, 1);
  return d.toLocaleDateString('es-MX', { month: 'short' });
}
function monthLabelFull(mStr){
  if (!mStr) return '';
  var p = mStr.split('-').map(Number);
  var d = new Date(p[0], p[1] - 1, 1);
  return d.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
}
function dueDate(y, m, day){ var last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(day, last)); }
function getMonthList(startM, endM){
  var res = [];
  if (!startM) return res;
  var s = startM.split('-').map(Number), e = endM.split('-').map(Number);
  var y = s[0], m = s[1];
  while (y < e[0] || (y === e[0] && m <= e[1])) {
    res.push(y + '-' + (m < 10 ? '0' : '') + m);
    m++; if (m > 12) { m = 1; y++; }
  }
  return res;
}
function vib(ms){ if (navigator.vibrate) navigator.vibrate(ms || 35); }

// LOGO HEADER COMPONENT
function appLogo() {
  return '<div class="top-logo-container">' +
    '<img src="logo.png" class="top-logo-img" alt="Passly" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';">' +
    '<h1 style="display:none; margin:0; font-size:28px;">Passly</h1>' +
  '</div>';
}

function getDebt(u){
  var t = today(), curM = mk(t);
  var start = u.startMonth || curM;
  var paid = Array.isArray(u.paidMonths) ? u.paidMonths : (u.paidFor ? [u.paidFor] : []);
  if (u.paused) {
    return { paused: true, unpaid: [], count: 0, debt: 0, isCurPaid: paid.indexOf(curM) !== -1, nextD: null, paidMonths: paid };
  }
  var list = getMonthList(start, curM);
  var unpaid = [];
  list.forEach(function(m){
    if (paid.indexOf(m) === -1) {
      if (m < curM) {
        unpaid.push(m);
      } else if (m === curM) {
        // PERIODO DE GRACIA: Si hoy es su día exacto, no es deuda todavía.
        if (t.getDate() > (u.day || 1)) unpaid.push(m);
      }
    }
  });
  var isCurPaid = paid.indexOf(curM) !== -1;
  var targetM = isCurPaid ? (function(){
    var p = curM.split('-').map(Number);
    var y = p[0], m = p[1] + 1; if (m > 12) { m = 1; y++; }
    return y + '-' + (m < 10 ? '0' : '') + m;
  })() : curM;
  var pTarget = targetM.split('-').map(Number);
  var nextD = dueDate(pTarget[0], pTarget[1] - 1, u.day || 1);
  return {
    paused: false,
    unpaid: unpaid,
    count: unpaid.length,
    debt: unpaid.length * (+u.amount || 0),
    isCurPaid: isCurPaid,
    nextD: nextD,
    paidMonths: paid
  };
}

function userChip(deb, u){
  if (u.paused) return '<span class="chip warn"><i class="icon" style="font-size:13px">pause</i> Pausado</span>';
  if (deb.count > 0) return '<span class="chip bad">Debe ' + deb.count + ' ' + (deb.count === 1 ? 'mes' : 'meses') + '</span>';
  if (deb.isCurPaid) return '<span class="chip ok"><i class="icon" style="font-size:13px">check</i> Al corriente</span>';
  var diff = Math.round((deb.nextD - today()) / 864e5);
  if (diff === 0) return '<span class="chip warn">Cobra hoy</span>';
  return '<span class="chip ' + (diff <= 3 ? 'warn' : '') + '">En ' + diff + ' d</span>';
}

function allUsers(){
  var a = [];
  S.accounts.forEach(function(c){ c.users.forEach(function(u){ a.push({ c: c, u: u, deb: getDebt(u) }); }); });
  return a;
}

function urow(x, acc){
  var c = x.c, u = x.u, deb = x.deb;
  var sub = [];
  if (acc) sub.push('<span>' + esc(c.name) + '</span>');
  sub.push('<span>' + money(u.amount) + '</span>');
  if (u.pfl) sub.push('<span>' + esc(u.pfl) + (u.pin ? ' PIN ' + esc(u.pin) : '') + '</span>');
  if (deb.count > 0) {
    sub.push('<span style="color:var(--bad)">Adeudo: ' + deb.unpaid.map(monthLabel).join(', ') + '</span>');
  } else if (!u.paused && deb.nextD) {
    sub.push('<span>' + (deb.isCurPaid ? 'Próximo ' : 'Corte ') + fmt(deb.nextD) + '</span>');
  }
  
  return '<div class="row ' + (u.paused ? 'paused' : '') + '">' +
    (acc ? badge(c, 1) : '') +
    '<div class="grow" onclick="editUser(\'' + c.id + '\',\'' + u.id + '\')">' +
      '<b>' + esc(u.name) + '</b>' +
      '<small>' + sub.join('') + '</small>' +
    '</div>' +
    '<div class="row-actions">' +
      userChip(deb, u) +
      '<button class="mini ' + (deb.count > 0 ? 'bad' : 'primary') + '" onclick="quickPay(\'' + c.id + '\',\'' + u.id + '\')">' +
        (deb.count > 0 ? 'Cobrar 1m' : (deb.isCurPaid ? 'Deshacer' : 'Ya pagó')) +
      '</button>' +
      '<button class="mini d" title="Eliminar usuario" onclick="quickDelUser(this,\'' + c.id + '\',\'' + u.id + '\')"><i class="icon" style="font-size:16px">delete</i></button>' +
    '</div>' +
  '</div>';
}

function quickPay(cid, uid){
  vib(40);
  var c = findAcc(cid), u = c.users.filter(function(x){ return x.id === uid; })[0];
  var deb = getDebt(u);
  if (!Array.isArray(u.paidMonths)) u.paidMonths = u.paidFor ? [u.paidFor] : [];
  if (deb.count > 0) {
    var mToPay = deb.unpaid[0];
    u.paidMonths.push(mToPay);
    toast('Cobrado mes de ' + monthLabelFull(mToPay));
  } else if (deb.isCurPaid) {
    u.paidMonths.pop();
    toast('Se deshizo el último pago');
  } else {
    var curM = mk(today());
    if (u.paidMonths.indexOf(curM) === -1) u.paidMonths.push(curM);
    toast('Mes corriente marcado como pagado');
  }
  save(); render();
}

function quickDelUser(btn, cid, uid){
  vib(50);
  if (!btn.dataset.s) {
    btn.dataset.s = "1";
    btn.innerHTML = '<i class="icon" style="font-size:16px">check</i>';
    toast('Toca otra vez para eliminar');
    setTimeout(function(){ btn.dataset.s = ''; btn.innerHTML = '<i class="icon" style="font-size:16px">delete</i>'; }, 3000);
    return;
  }
  delUser(cid, uid);
}

function home(){
  var us = allUsers();
  var totMonth = 0, gotMonth = 0, totalDebt = 0;
  var curM = mk(today());
  us.forEach(function(x){
    var u = x.u, deb = x.deb;
    if (!u.paused) totMonth += +u.amount || 0;
    if (deb.isCurPaid) gotMonth += +u.amount || 0;
    totalDebt += deb.debt;
  });

  var bTxt = 'Sin respaldos', bWarn = true;
  if (S.lastBackup) {
    var days = Math.floor((Date.now() - S.lastBackup) / 864e5);
    bTxt = days === 0 ? 'Respaldo al día (hoy)' : 'Último respaldo hace ' + days + ' d';
    bWarn = days > 7;
  }

  var h = appLogo() + 
    '<div class="top-actions">' +
      '<button class="btn" style="flex:2" onclick="editAcc(\'\')"><i class="icon">add</i> Nueva cuenta</button>' +
      '<button class="btn g" style="flex:1" onclick="openVault()"><i class="icon">lock_open</i> Bóveda</button>' +
    '</div>';

  if (!S.accounts.length) {
    return h + '<div class="empty"><p>Aún no tienes cuentas registradas.</p><button class="btn" onclick="editAcc(\'\')">Crear cuenta</button></div>' + homeFooter(bTxt, bWarn);
  }

  h += '<div class="strip">' +
    '<div><b>' + money(totMonth) + '</b><small>Meta mes</small></div>' +
    '<div><b style="color:var(--ok)">' + money(gotMonth) + '</b><small>Cobrado</small></div>' +
    '<div><b style="color:' + (totalDebt ? 'var(--bad)' : 'var(--mu)') + '">' + money(totalDebt) + '</b><small>Adeudo total</small></div>' +
  '</div>' +
  ownBlock(totMonth) +
  '<h2>Cobros y vencimientos</h2>';

  if (!us.length) return h + '<div class="empty"><p>Agrega perfiles a tus cuentas para verlos aquí.</p></div>' + homeFooter(bTxt, bWarn);

  us.sort(function(a,b){
    if (b.deb.count !== a.deb.count) return b.deb.count - a.deb.count;
    return (a.deb.nextD || 0) - (b.deb.nextD || 0);
  });
  return h + us.map(function(x){ return urow(x, true); }).join('') + homeFooter(bTxt, bWarn);
}

function homeFooter(bTxt, bWarn){
  return '<div class="card" style="margin-top:28px;border-style:dashed;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">' +

    c.name = v.name; c.login = v.login; c.cost = v.cost; c.payDay = v.payDay;

}

/* BOVEDA Y ENCRIPTACION */
var vaultTimer = null;
function openVault(){
  withKey(function(){
    var accs = S.accounts.filter(function(c){ return c.mode !== 'fam' && (c.login || c.pw); });
    var secLeft = 30, timerStr = function(){ return 'Se cerrará en ' + secLeft + 's'; };
    var renderList = function(){
      var h = '<h2><i class="icon" style="color:var(--primary)">lock_open</i> Bóveda de contraseñas</h2>' +
        '<p style="display:flex;justify-content:space-between;align-items:center"><span>Credenciales protegidas</span><b id="vCountdown" class="chip warn">' + timerStr() + '</b></p><div style="height:12px"></div>';
      if (!accs.length) h += '<div class="empty"><p>No tienes contraseñas guardadas.</p></div>';
      else h += accs.map(function(c){
          return '<div class="vault"><div class="vr"><span style="display:flex;align-items:center;gap:8px"><b>' + esc(c.name) + '</b></span>' +
            (c.login ? '<button class="mini" onclick="copyTxt(decodeURIComponent(\'' + encodeURIComponent(c.login) + '\'))">Copiar usuario</button>' : '') + '</div>' +
            (c.login ? '<div class="vr"><span>Usuario: <code>' + esc(c.login) + '</code></span></div>' : '') +
            (c.pw ? '<div class="vr"><span>Clave: <code id="pwv-' + c.id + '">••••••••</code></span><span><button class="mini" onclick="toggleVaultPw(\'' + c.id + '\')">Ver</button> <button class="mini" onclick="pwCopy(\'' + c.id + '\')">Copiar</button></span></div>' : '') +
          '</div>';
        }).join('');
      h += '<div class="acts" style="flex-direction:column">' +
        (accs.length ? '<button class="btn g" onclick="copyAllVault()"><i class="icon">content_copy</i> Copiar todas las contraseñas</button>' : '') +
        '<button class="btn" onclick="closeS()">Cerrar bóveda</button></div>';
      openS(h);
    };
    renderList();
    if (vaultTimer) clearInterval(vaultTimer);
    vaultTimer = setInterval(function(){
      secLeft--; var el = $('#vCountdown'); if (el) el.textContent = timerStr();
      if (secLeft <= 0) { clearInterval(vaultTimer); closeS(); toast('Bóveda bloqueada por seguridad'); }
    }, 1000);
  });
}
function toggleVaultPw(id){ var el = $('#pwv-' + id); if (!el) return; if (el.dataset.v) { el.textContent = '••••••••'; delete el.dataset.v; } else { pwGet(id, function(t){ el.textContent = t; el.dataset.v = "1"; }); } }
async function copyAllVault(){
  vib(50); if (!confirm('⚠️ Advertencia: Todas las contraseñas se copiarán en texto plano. ¿Continuar?')) return;
  var accs = S.accounts.filter(function(c){ return c.mode !== 'fam' && (c.login || c.pw); }), lines = ['--- BÓVEDA DE ACCESOS PASSLY ---'];
  for (var i = 0; i < accs.length; i++) { var c = accs[i], p = c.pw ? await dec(c.pw) : '(sin clave)'; lines.push('Cuenta: ' + c.name + '\nUsuario: ' + (c.login || '-') + '\nContraseña: ' + p + '\n'); }
  copyTxt(lines.join('\n'));
}
var KEY_CRYPTO = null, pend = null, TK = '', TB = '';
function b64(u){ return btoa(String.fromCharCode.apply(null, u)); }
function ub(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function derive(pw, salt){
  var m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(salt), iterations: 150000, hash: 'SHA-256' }, m, { name: 'AES-GCM', length: 256 }, false, ['encrypt','decrypt']);
}
async function enc(t){
  var iv = crypto.getRandomValues(new Uint8Array(12)), c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, KEY_CRYPTO, new TextEncoder().encode(t));
  return b64(iv) + '.' + b64(new Uint8Array(c));
}
async function dec(s){
  var p = s.split('.'), d = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(p[0]) }, KEY_CRYPTO, ub(p[1]));
  return new TextDecoder().decode(d);
}
function say(t){ var m = $('#msg'); if (m) m.textContent = t; }
function withKey(fn){
  if (KEY_CRYPTO) { fn(); return; }
  pend = fn; var n = !S.vault;
  openS('<h2>' + (n ? 'Crea tu clave maestra' : 'Desbloquear contraseñas') + '</h2>' +
    '<p>' + (n ? 'Protege tus contraseñas con cifrado. Si la olvidas, nadie podrá recuperarlas.' : 'Escribe tu clave maestra para desbloquear.') + '</p>' +
    '<label>Clave maestra</label><input id="mf1" type="password" autocomplete="off">' +
    (n ? '<label>Repite la clave</label><input id="mf2" type="password" autocomplete="off">' : '') +
    '<div class="acts"><button class="btn g" onclick="pend=null;closeS()">Cancelar</button><button class="btn" onclick="doUnlock()">Continuar</button></div><p id="msg" style="margin-top:10px;color:var(--bad)"></p>');
}
async function doUnlock(){
  var p = $('#mf1').value; if (!p) { say('Escribe tu clave.'); return; }
  try {
    if (!S.vault) {
      if (p.length < 6 || p !== $('#mf2').value) { say('Mínimo 6 caracteres y repítela igual.'); return; }
      var salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      KEY_CRYPTO = await derive(p, salt); S.vault = { salt: salt, check: await enc('ok') }; save();
    } else {
      KEY_CRYPTO = await derive(p, S.vault.salt); if (await dec(S.vault.check) !== 'ok') throw 0;
    }
  } catch (e) { KEY_CRYPTO = null; say('Clave incorrecta.'); return; }
  var f = pend; pend = null; closeS(); if (f) f();
}
function showPw(id){ var fill = function(){ dec(findAcc(id).pw).then(function(t){ var e = $('#f5'); e.value = t; e.type = 'text'; }); }; if (KEY_CRYPTO) fill(); else withKey(function(){ editAcc(id); fill(); }); }

function orow(c, nm){
  if (!c.payDay) return '';

function clients(){

      var g = m[k], deb = getDebt(u);
      g.phone = g.phone || u.phone || '';
      if (!u.paused) g.tot += +u.amount || 0;
      g.debt += deb.debt; g.it.push({ c: c, u: u, deb: deb });

    return '<div class="card"><div class="card-header"><div class="grow"><b>' + esc(g.name) + '</b><small><span>' + (g.phone ? esc(g.phone) : 'Sin WhatsApp') + '</span><span>' + money(g.tot) + ' al mes</span></small></div>' + (g.debt > 0 ? '<span class="chip bad">Debe ' + money(g.debt) + '</span>' : '<span class="chip ok">Al corriente</span>') + '</div>' + g.it.map(function(x){
