<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Passly — Gestor de Cobros</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg: #000000;
  --surface: #0a0a0a;
  --surface-c: #121212;
  --surface-high: #1a1a1a;
  --surface-highest: #242424;
  --line: #222222;
  --line-subtle: #171717;
  --tx: #f8fafc;
  --mu: #8e8e93;
  --primary: #38bdf8;
  --primary-hover: #0ea5e9;
  --primary-container: #082f49;
  --on-primary: #000000;
  --on-primary-container: #bae6fd;
  --ok: #34d399;
  --ok-bg: #064e3b;
  --bad: #f87171;
  --bad-bg: #450a0a;
  --warn: #fbbf24;
  --warn-bg: #451a03;
  color-scheme: dark;
  box-sizing: border-box;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  padding-bottom:120px;
}
main{max-width:580px;margin:0 auto;padding:16px 16px 24px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:8px 0 4px;color:#fff}
h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:24px 0 12px;color:#fff}
p{margin:0;color:var(--mu);font-size:14px}
.banner-alert{background:var(--bad-bg);border:1px solid var(--bad);color:#fecaca;padding:12px 16px;border-radius:18px;font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.top-actions{display:flex;gap:10px;margin:18px 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9999px;padding:13px 20px;font:700 14px 'Plus Jakarta Sans',sans-serif;background:var(--primary);color:var(--on-primary);cursor:pointer;transition:all .15s ease}
.btn:active{transform:scale(0.97);opacity:.9}
.btn.g{background:var(--surface-high);color:var(--tx);border:1px solid var(--line)}
.btn.d{background:var(--bad-bg);color:var(--bad);border:1px solid #7f1d1d}
.btn.w{background:#25d366;color:#032912}
.btn.subtle{background:transparent;border:1px solid var(--line);color:var(--mu);padding:8px 14px;border-radius:9999px;font-size:13px}
.btn.subtle.d{border-color:#7f1d1d;color:var(--bad)}

.strip{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-c);border:1px solid var(--line-subtle);border-radius:24px;padding:16px 8px;margin-bottom:20px}
.strip div{text-align:center;border-right:1px solid var(--line-subtle);padding:0 4px}
.strip div:last-child{border:0}
.strip b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.strip small{color:var(--mu);font-size:12px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:16px;position:relative}
.card-header{display:flex;align-items:center;gap:12px}
.card-header .grow b{font-size:17px;font-weight:700}
.subtabs{display:flex;gap:6px;background:var(--surface-c);padding:4px;border-radius:16px;margin:12px 0 14px;border:1px solid var(--line-subtle)}
.subtab{flex:1;border:0;background:transparent;color:var(--mu);font:600 12px 'Plus Jakarta Sans',sans-serif;padding:8px 4px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s ease}
.subtab.on{background:var(--surface-high);color:var(--primary);border:1px solid var(--line)}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface-c);border:1px solid var(--line-subtle);border-radius:18px;padding:12px;margin-bottom:8px}
.row.paused{opacity:.65;border-style:dashed}
.grow{flex:1 1 100%;min-width:0;cursor:pointer;margin-bottom:4px}
@media (min-width: 480px){ .grow{flex:1;margin-bottom:0;} }
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.grow small{color:var(--mu);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row-actions{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start}
@media (min-width: 480px){ .row-actions{width:auto;justify-content:flex-end;} }

.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:9999px;background:var(--surface-high);color:var(--mu);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

.mini{border:1px solid var(--line);background:var(--surface-high);color:var(--tx);border-radius:9999px;padding:7px 12px;font:600 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.mini:active{transform:scale(0.96)}
.mini.d{border-color:#7f1d1d;color:var(--bad);background:var(--bad-bg)}
.mini.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.mini.primary{border-color:var(--primary);color:var(--on-primary);background:var(--primary)}

.add{width:100%;border:1px dashed var(--line);background:var(--surface-c);color:var(--primary);border-radius:16px;padding:12px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 20px;text-align:center}
.empty p{margin-bottom:16px}

nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 24px;
  width: calc(100% - 32px);
  max-width: 360px;
  background: rgba(18, 18, 18, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: 9999px;
  display: flex;
  justify-content: space-between;
  padding: 6px;
  z-index: 40;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.nav-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 9999px;
  border: 0;
  background: transparent;
  color: var(--mu);
  font: 700 14px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-btn .txt { display: none; }
.nav-btn.on { background: var(--primary-container); color: var(--primary); }
.nav-btn.on .txt { display: block; color: var(--primary); }
.nav-btn.on .icon { color: var(--primary); }

#sheet{position:fixed;inset:0;display:none;z-index:50}
#sheet.on{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px)}
.pan{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:580px;max-height:90%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}

label{display:block;color:var(--mu);font-size:13px;font-weight:600;margin:14px 0 6px}
input,textarea,select{width:100%;background:var(--surface-c);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:13px 14px;font:15px 'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{height:130px;font:12px ui-monospace,monospace}
.inp-eye{display:flex;gap:8px;align-items:center}
.inp-eye input{flex:1}
.eye-btn{border:1px solid var(--line);background:var(--surface-high);color:var(--mu);border-radius:14px;width:46px;height:46px;flex:none;display:grid;place-items:center;cursor:pointer}
.eye-btn:active{transform:scale(0.95);color:var(--primary)}
.acts{display:flex;gap:10px;margin-top:20px}
.acts .btn{flex:1}

.vault{background:var(--surface-c);border:1px solid var(--line-subtle);border-radius:18px;padding:12px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.vr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vr code{font-family:ui-monospace,monospace;color:var(--primary);font-size:14px}
.lg{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 15px 'Plus Jakarta Sans',sans-serif;color:#fff;flex:none;object-fit:cover}
.lg.sm{width:34px;height:34px;border-radius:10px;font-size:13px}
.plat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb{display:flex;align-items:center;gap:8px;background:var(--surface-c);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:8px 10px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left}
.pb.on{border-color:var(--primary);background:var(--primary-container);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--surface-highest);color:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:9999px;z-index:90;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:14px;cursor:pointer;color:var(--tx)}
.chk input{width:auto}
.tkc{background:var(--surface-c);border:1px solid var(--line);border-radius:22px;padding:10px 16px;margin:14px 0 8px}
.tr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-subtle)}
.tr:last-child{border:0}
.ta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tt{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tt span{color:var(--mu);font-size:14px}
.tt b{font-size:16px;font-variant-numeric:tabular-nums;color:#fff}
.tt.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.tt.total b{font-size:20px}
.cred-box{background:var(--surface-high);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:12px}
.cred-box b{color:var(--primary);display:block;margin-bottom:4px}
.icon{font-family:'Material Symbols Rounded',sans-serif;font-style:normal;vertical-align:middle;line-height:1}

.top-logo-container { display:flex; justify-content:center; align-items:center; padding: 8px 0 24px; }
.top-logo-img { height: 48px; border-radius: 12px; object-fit: contain; }

/* LOGIN ESTILO GOOGLE (Material 3 Dark) */
.g-wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}
.g-card{
  width:100%;
  max-width:420px;
  background:#111111;
  border:1px solid #262626;
  border-radius:28px;
  padding:36px 28px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
}
.g-logo{display:flex;justify-content:center;margin-bottom:18px}
.g-logo img{height:44px;border-radius:10px}
.g-title{text-align:center;font-size:24px;font-weight:700;color:#fff;margin:0 0 6px}
.g-sub{text-align:center;font-size:14px;color:var(--mu);margin:0 0 26px}
.g-pill{
  display:inline-flex;align-items:center;gap:8px;
  margin:0 auto 22px;padding:6px 14px 6px 8px;
  background:#1a1a1a;border:1px solid #2c2c2e;border-radius:9999px;
  color:#e2e8f0;font-size:13px;font-weight:600;cursor:pointer;
}
.g-pill-wrap{display:flex;justify-content:center}
.g-field{position:relative;margin-bottom:14px}
.g-field input{
  width:100%;background:#0a0a0a;border:1px solid #333;border-radius:12px;
  padding:15px 16px;font-size:15px;color:#fff;
}
.g-field input:focus{border-color:#8ab4f8;box-shadow:0 0 0 1px #8ab4f8}
.g-actions{display:flex;align-items:center;justify-content:space-between;margin-top:28px;gap:10px}
.g-btn{
  background:#8ab4f8;color:#062e6f;border:0;border-radius:9999px;
  padding:11px 24px;font:700 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;
}
.g-btn:active{transform:scale(0.97)}
.g-link{
  background:transparent;border:0;color:#8ab4f8;font:600 14px 'Plus Jakarta Sans',sans-serif;
  padding:8px 10px;border-radius:8px;cursor:pointer;
}
.g-err{color:var(--bad);font-size:13px;margin-top:10px;display:flex;align-items:center;gap:6px}
.g-foot{margin-top:20px;font-size:12px;color:var(--mu);text-align:center}
</style>
</head>
<body>
<div id="storageAlert"></div>
<main id="app"></main>
<nav id="mainNav" style="display:none">
<button class="nav-btn" id="n1" onclick="go('home')"><i class="icon">home</i><span class="txt">Inicio</span></button>
<button class="nav-btn" id="n2" onclick="go('accts')"><i class="icon">dataset</i><span class="txt">Cuentas</span></button>
<button class="nav-btn" id="n3" onclick="go('clients')"><i class="icon">group</i><span class="txt">Clientes</span></button>
<button class="nav-btn" id="n4" onclick="go('sets')"><i class="icon">settings</i><span class="txt">Ajustes</span></button>
</nav>
<div id="sheet"></div>

<script>
/* =========================================================
   CONFIGURACIÓN DE FIREBASE (PEGA AQUÍ TUS DATOS)
   ========================================================= */
var FIREBASE_CONFIG = {
  apiKey: "PEGA_AQUI_TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.firebasestorage.app",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:000000000000"
};
var ADMIN_UID = "PEGA_AQUI_TU_UID_DE_ADMIN";
/* ========================================================= */

var KEY = 'subs-v1', S = { accounts: [], settings: {}, lastBackup: null, portalMap: {} }, view = 'home';
var ACC_EXP = {}, ACC_TAB = {};
var FB_READY = false, auth = null, db = null, CUR_USER = null, USER_ROLE = null; // 'admin' | 'client' | 'local'
var LOGIN_STEP = 1, LOGIN_EMAIL = '', LOGIN_ERR = '', PORTAL_DATA = null;

if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PEGA_AQUI') !== 0 && window.firebase) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    FB_READY = true;
  } catch (e) { console.error(e); }
}

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});

function testStorage() {
  try { localStorage.setItem('__ptest', '1'); localStorage.removeItem('__ptest'); return true; } 
  catch(e) { return false; }
}
if (!testStorage()) {
  document.getElementById('storageAlert').innerHTML = '<div class="banner-alert" style="margin:12px 16px 0"><i class="icon">error</i> Tus datos no se están guardando. Desactiva modo incógnito.</div>';
}

try { var raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch(e) {}
if (!S.portalMap) S.portalMap = {};

var syncTimer = null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (FB_READY && USER_ROLE === 'admin' && db) {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){
      db.collection('admin').doc('datos').set(S).catch(function(e){ console.error('Sync error:', e); });
    }, 600);
  }
}

var $ = function(s){ return document.querySelector(s); };
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s||'').replace(/[&<>"]/g, function(c){ return {'&':'&','<':'<','>':'>','"':'"'}[c]; }); }
function money(n){ return '$' + (+n||0).toLocaleString('es-MX', { maximumFractionDigits: 2 }); }
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function mk(d){ var m = d.getMonth() + 1; return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m; }
function fmt(d){ return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }); }
function monthLabel(mStr){
  if (!mStr) return '';
  var p = mStr.split('-').map(Number);
  var d = new Date(p[0], p[1] - 1, 1);
  return d.toLocaleDateString('es-MX', { month: 'short' });
}
function monthLabelFull(mStr){
  if (!mStr) return '';
  var p = mStr.split('-').map(Number);
  var d = new Date(p[0], p[1] - 1, 1);
  return d.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
}
function dueDate(y, m, day){ var last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(day, last)); }
function getMonthList(startM, endM){
  var res = [];
  if (!startM) return res;
  var s = startM.split('-').map(Number), e = endM.split('-').map(Number);
  var y = s[0], m = s[1];
  while (y < e[0] || (y === e[0] && m <= e[1])) {
    res.push(y + '-' + (m < 10 ? '0' : '') + m);
    m++; if (m > 12) { m = 1; y++; }
  }
  return res;
}
function vib(ms){ if (navigator.vibrate) navigator.vibrate(ms || 35); }
function toggleInp(id, btn){
  var el = document.getElementById(id);
  if (!el) return;
  var show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.innerHTML = '<i class="icon" style="font-size:20px">' + (show ? 'visibility_off' : 'visibility') + '</i>';
}

function appLogo() {
  return '<div class="top-logo-container">' +
    '<img src="logo.png" class="top-logo-img" alt="Passly" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';">' +
    '<h1 style="display:none; margin:0; font-size:28px;">Passly</h1>' +
  '</div>';
}

/* =========================================================
   LOGIN ESTILO GOOGLE + ENRUTAMIENTO POR ROL
   ========================================================= */
function renderLogin(){
  $('#mainNav').style.display = 'none';
  document.body.style.paddingBottom = '24px';
  var errHtml = LOGIN_ERR ? '<div class="g-err"><i class="icon" style="font-size:18px">error</i><span>' + esc(LOGIN_ERR) + '</span></div>' : '';
  var inner = '';

  if (LOGIN_STEP === 1) {
    inner =
      '<h1 class="g-title">Iniciar sesión</h1>' +
      '<p class="g-sub">Usa tu cuenta de Passly</p>' +
      '<div class="g-field"><input id="lgEmail" type="email" autocomplete="username" placeholder="Correo electrónico" value="' + esc(LOGIN_EMAIL) + '" onkeydown="if(event.key===\'Enter\')loginNext()"></div>' +
      errHtml +
      '<div class="g-actions">' +
        (!FB_READY ? '<button class="g-link" onclick="enterLocalMode()">Entrar en modo local</button>' : '<span></span>') +
        '<button class="g-btn" onclick="loginNext()">Siguiente</button>' +
      '</div>';
  } else {
    inner =
      '<h1 class="g-title">Te damos la bienvenida</h1>' +
      '<div class="g-pill-wrap"><button class="g-pill" onclick="LOGIN_STEP=1;LOGIN_ERR=\'\';renderLogin()"><i class="icon" style="font-size:18px;color:#8ab4f8">account_circle</i><span>' + esc(LOGIN_EMAIL) + '</span><i class="icon" style="font-size:16px">expand_more</i></button></div>' +
      '<div class="g-field inp-eye">' +
        '<input id="lgPass" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" onkeydown="if(event.key===\'Enter\')doLogin()">' +
        '<button class="eye-btn" type="button" onclick="toggleInp(\'lgPass\', this)"><i class="icon" style="font-size:20px">visibility</i></button>' +
      '</div>' +
      errHtml +
      '<div class="g-actions">' +
        '<button class="g-link" onclick="LOGIN_STEP=1;LOGIN_ERR=\'\';renderLogin()">Atrás</button>' +
        '<button class="g-btn" id="btnDoLogin" onclick="doLogin()">Iniciar sesión</button>' +
      '</div>';
  }

  $('#app').innerHTML =
    '<div class="g-wrap">' +
      '<div class="g-card">' +
        '<div class="g-logo"><img src="logo.png" alt="Passly" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><b style="display:none;font-size:24px;color:#fff">Passly</b></div>' +
        inner +
      '</div>' +
      '<div class="g-foot">' + (FB_READY ? 'Conexión segura con Firebase • Passly v4.0' : 'Firebase aún no configurado • Puedes usar el modo local') + '</div>' +
    '</div>';

  setTimeout(function(){
    var f = $(LOGIN_STEP === 1 ? '#lgEmail' : '#lgPass');
    if (f) f.focus();
  }, 60);
}

function loginNext(){
  var e = ($('#lgEmail').value || '').trim();
  if (!e || e.indexOf('@') === -1) { LOGIN_ERR = 'Ingresa un correo electrónico válido.'; renderLogin(); return; }
  LOGIN_EMAIL = e; LOGIN_ERR = ''; LOGIN_STEP = 2; renderLogin();
}

function enterLocalMode(){
  USER_ROLE = 'local';
  document.body.style.paddingBottom = '120px';
  $('#mainNav').style.display = 'flex';
  render();
}

async function doLogin(){
  if (!FB_READY) { LOGIN_ERR = 'Primero pega tu configuración de Firebase en el código.'; renderLogin(); return; }
  var p = ($('#lgPass').value || '');
  if (!p) { LOGIN_ERR = 'Ingresa tu contraseña.'; renderLogin(); return; }
  var btn = $('#btnDoLogin'); if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }
  try {
    await auth.signInWithEmailAndPassword(LOGIN_EMAIL, p);
    LOGIN_ERR = '';
  } catch (e) {
    LOGIN_ERR = 'Correo o contraseña incorrectos.';
    renderLogin();
  }
}

function doLogout(){
  if (FB_READY && auth) auth.signOut();
  CUR_USER = null; USER_ROLE = null; PORTAL_DATA = null; LOGIN_STEP = 1; LOGIN_ERR = '';
  renderLogin();
}

/* =========================================================
   RESTO DE PASSLY (ADMIN + FACTURACIÓN + BÓVEDA)
   ========================================================= */
function getDebt(u){
  var t = today(), curM = mk(t);
  var start = u.startMonth || curM;
  var paid = Array.isArray(u.paidMonths) ? u.paidMonths : (u.paidFor ? [u.paidFor] : []);
  if (u.paused) return { paused: true, unpaid: [], count: 0, debt: 0, isCurPaid: paid.indexOf(curM) !== -1, nextD: null, paidMonths: paid };
  var list = getMonthList(start, curM), unpaid = [];
  list.forEach(function(m){
    if (paid.indexOf(m) === -1) {
      if (m < curM) unpaid.push(m);
      else if (m === curM && t.getDate() > (u.day || 1)) unpaid.push(m);
    }
  });
  var isCurPaid = paid.indexOf(curM) !== -1;
  var targetM = isCurPaid ? (function(){ var p = curM.split('-').map(Number), y = p[0], m = p[1] + 1; if (m > 12) { m = 1; y++; } return y + '-' + (m < 10 ? '0' : '') + m; })() : curM;
  var pTarget = targetM.split('-').map(Number);
  var nextD = dueDate(pTarget[0], pTarget[1] - 1, u.day || 1);
  return { paused: false, unpaid: unpaid, count: unpaid.length, debt: unpaid.length * (+u.amount || 0), isCurPaid: isCurPaid, nextD: nextD, paidMonths: paid };
}

function getBillingInfo(u){
  var deb = getDebt(u), t = today(), curM = mk(t), amt = +u.amount || 0;
  if (u.paused) return { deb: deb, pastMonths: [], pastDebt: 0, curDue: 0, totalPay: 0, statusText: 'Servicio pausado', shortStatus: 'Pausado', badgeCls: 'warn', nextCycleText: 'Pausado', isUpToDate: true };
  var pastMonths = deb.unpaid.filter(function(m){ return m < curM; });
  var pastDebt = pastMonths.length * amt;
  var curDue = deb.isCurPaid ? 0 : amt;
  var totalPay = pastDebt + curDue;
  var nextDateStr = deb.nextD ? fmt(deb.nextD) : '';
  var diff = deb.nextD ? Math.round((deb.nextD - t) / 864e5) : 0;
  var statusText = '', shortStatus = '', badgeCls = 'ok';
  if (deb.isCurPaid && pastMonths.length === 0) {
    statusText = 'Al corriente — Siguiente ciclo: ' + nextDateStr; shortStatus = 'Próx. ' + nextDateStr; badgeCls = 'ok';
  } else if (pastMonths.length > 0 && curDue > 0) {
    statusText = 'Adeudo anterior (' + pastMonths.map(monthLabel).join(', ') + ') + Ciclo actual (' + monthLabel(curM) + ')'; shortStatus = 'Debe ' + (pastMonths.length + 1) + ' m'; badgeCls = 'bad';
  } else if (pastMonths.length > 0 && curDue === 0) {
    statusText = 'Adeudo anterior (' + pastMonths.map(monthLabel).join(', ') + ') • Ciclo actual pagado'; shortStatus = 'Debe ' + pastMonths.length + ' m'; badgeCls = 'bad';
  } else {
    if (diff < 0) { statusText = 'Ciclo actual vencido (corte ' + nextDateStr + ')'; shortStatus = 'Vencido'; badgeCls = 'bad'; }
    else if (diff === 0) { statusText = 'Fecha de pago hoy (' + nextDateStr + ')'; shortStatus = 'Cobra hoy'; badgeCls = 'warn'; }
    else { statusText = 'Siguiente ciclo: ' + nextDateStr + ' (en ' + diff + ' días)'; shortStatus = 'Corte ' + nextDateStr; badgeCls = diff <= 3 ? 'warn' : ''; }
  }
  return { deb: deb, pastMonths: pastMonths, pastDebt: pastDebt, curDue: curDue, totalPay: totalPay, statusText: statusText, shortStatus: shortStatus, badgeCls: badgeCls, nextCycleText: nextDateStr, isUpToDate: (totalPay === 0) };
}

function userChip(deb, u){
  if (u.paused) return '<span class="chip warn"><i class="icon" style="font-size:13px">pause</i> Pausado</span>';
  if (deb.count > 0) return '<span class="chip bad">Debe ' + deb.count + ' ' + (deb.count === 1 ? 'mes' : 'meses') + '</span>';
  if (deb.isCurPaid) return '<span class="chip ok"><i class="icon" style="font-size:13px">check</i> Al corriente</span>';
  var diff = Math.round((deb.nextD - today()) / 864e5);
  if (diff === 0) return '<span class="chip warn">Cobra hoy</span>';
  return '<span class="chip ' + (diff <= 3 ? 'warn' : '') + '">En ' + diff + ' d</span>';
}

function allUsers(){ var a = []; S.accounts.forEach(function(c){ c.users.forEach(function(u){ a.push({ c: c, u: u, deb: getDebt(u) }); }); }); return a; }

function urow(x, acc){
  var c = x.c, u = x.u, deb = x.deb, sub = [];
  if (acc) sub.push('<span>' + esc(c.name) + '</span>');
  sub.push('<span>' + money(u.amount) + '</span>');
  if (u.pfl) sub.push('<span>' + esc(u.pfl) + (u.pin ? ' PIN ' + esc(u.pin) : '') + '</span>');
  if (deb.count > 0) sub.push('<span style="color:var(--bad)">Adeudo: ' + deb.unpaid.map(monthLabel).join(', ') + '</span>');
  else if (!u.paused && deb.nextD) sub.push('<span>' + (deb.isCurPaid ? 'Próximo ' : 'Corte ') + fmt(deb.nextD) + '</span>');
  return '<div class="row ' + (u.paused ? 'paused' : '') + '">' + (acc ? badge(c, 1) : '') +
    '<div class="grow" onclick="editUser(\'' + c.id + '\',\'' + u.id + '\')"><b>' + esc(u.name) + '</b><small>' + sub.join('') + '</small></div>' +
    '<div class="row-actions">' + userChip(deb, u) +
      '<button class="mini ' + (deb.count > 0 ? 'bad' : 'primary') + '" onclick="quickPay(\'' + c.id + '\',\'' + u.id + '\')">' + (deb.count > 0 ? 'Cobrar 1m' : (deb.isCurPaid ? 'Deshacer' : 'Ya pagó')) + '</button>' +
      '<button class="mini d" onclick="quickDelUser(this,\'' + c.id + '\',\'' + u.id + '\')"><i class="icon" style="font-size:16px">delete</i></button>' +
    '</div></div>';
}

function quickPay(cid, uid){
  vib(40);
  var c = findAcc(cid), u = c.users.filter(function(x){ return x.id === uid; })[0], deb = getDebt(u);
  if (!Array.isArray(u.paidMonths)) u.paidMonths = u.paidFor ? [u.paidFor] : [];
  if (deb.count > 0) { var mToPay = deb.unpaid[0]; u.paidMonths.push(mToPay); toast('Cobrado mes de ' + monthLabelFull(mToPay)); }
  else if (deb.isCurPaid) { u.paidMonths.pop(); toast('Se deshizo el último pago'); }
  else { var curM = mk(today()); if (u.paidMonths.indexOf(curM) === -1) u.paidMonths.push(curM); toast('Mes corriente marcado como pagado'); }
  save(); render();
}

function quickDelUser(btn, cid, uid){

  if (!btn.dataset.s) { btn.dataset.s = "1"; btn.innerHTML = '<i class="icon" style="font-size:16px">check</i>'; toast('Toca otra vez para eliminar'); setTimeout(function(){ btn.dataset.s = ''; btn.innerHTML = '<i class="icon" style="font-size:16px">delete</i>'; }, 3000); return; }
  delUser(cid, uid);
}

  us.forEach(function(x){ var u = x.u, deb = x.deb; if (!u.paused) totMonth += +u.amount || 0; if (deb.isCurPaid) gotMonth += +u.amount || 0; totalDebt += deb.debt; });
  var bTxt = USER_ROLE === 'admin' ? 'Sincronizado en la nube (Firebase)' : (S.lastBackup ? 'Último respaldo hace ' + Math.floor((Date.now() - S.lastBackup) / 864e5) + ' d' : 'Sin respaldos');

  if (!S.accounts.length) return h + '<div class="empty"><p>Aún no tienes cuentas registradas.</p><button class="btn" onclick="editAcc(\'\')">Crear cuenta</button></div>' + homeFooter(bTxt, false);
  h += '<div class="strip"><div><b>' + money(totMonth) + '</b><small>Meta mes</small></div><div><b style="color:var(--ok)">' + money(gotMonth) + '</b><small>Cobrado</small></div><div><b style="color:' + (totalDebt ? 'var(--bad)' : 'var(--mu)') + '">' + money(totalDebt) + '</b><small>Adeudo total</small></div></div>' + ownBlock(totMonth) + '<h2>Cobros y vencimientos</h2>';
  if (!us.length) return h + '<div class="empty"><p>Agrega perfiles a tus cuentas para verlos aquí.</p></div>' + homeFooter(bTxt, false);
  us.sort(function(a,b){ if (b.deb.count !== a.deb.count) return b.deb.count - a.deb.count; return (a.deb.nextD || 0) - (b.deb.nextD || 0); });

var vaultTimer = null;
function openVault(){
  withKey(function(){
    var accs = S.accounts.filter(function(c){ return c.mode !== 'fam' && (c.login || c.pw); }), secLeft = 30, timerStr = function(){ return 'Se cerrará en ' + secLeft + 's'; };

    if (!accs.length) h += '<div class="empty"><p>No tienes contraseñas guardadas.</p></div>';

    }).join('');

  });

function toggleVaultPw(id){ var el = $('#pwv-' + id); if (!el) return; if (el.dataset.v) { el.textContent = '••••••••'; delete el.dataset.v; } else { pwGet(id, function(t){ el.textContent = t; el.dataset.v = "1"; }); } }
async function copyAllVault(){
  vib(50); if (!confirm('¿Copiar todas las contraseñas en texto plano?')) return;
  var accs = S.accounts.filter(function(c){ return c.mode !== 'fam' && (c.login || c.pw); }), lines = ['--- BÓVEDA PASSLY ---'];
  for (var i = 0; i < accs.length; i++) { var c = accs[i], p = c.pw ? await dec(c.pw) : '(sin clave)'; lines.push('Cuenta: ' + c.name + '\nUsuario: ' + (c.login || '-') + '\nContraseña: ' + p + '\n'); }
  copyTxt(lines.join('\n'));
}
var KEY_CRYPTO = null, pend = null, TK = '', TB = '';
function b64(u){ return btoa(String.fromCharCode.apply(null, u)); }
function ub(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function derive(pw, salt){ var m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(salt), iterations: 150000, hash: 'SHA-256' }, m, { name: 'AES-GCM', length: 256 }, false, ['encrypt','decrypt']); }
async function enc(t){ var iv = crypto.getRandomValues(new Uint8Array(12)), c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, KEY_CRYPTO, new TextEncoder().encode(t)); return b64(iv) + '.' + b64(new Uint8Array(c)); }
async function dec(s){ var p = s.split('.'), d = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(p[0]) }, KEY_CRYPTO, ub(p[1])); return new TextDecoder().decode(d); }
function say(t){ var m = $('#msg'); if (m) m.textContent = t; }
function withKey(fn){
  if (KEY_CRYPTO) { fn(); return; }
  pend = fn; var n = !S.vault;
  openS('<h2>' + (n ? 'Crea tu clave maestra' : 'Desbloquear contraseñas') + '</h2><p>' + (n ? 'Protege tus contraseñas con cifrado.' : 'Escribe tu clave maestra.') + '</p><label>Clave maestra</label><div class="inp-eye"><input id="mf1" type="password" autocomplete="off"><button class="eye-btn" type="button" onclick="toggleInp(\'mf1\', this)"><i class="icon" style="font-size:20px">visibility</i></button></div>' + (n ? '<label>Repite la clave</label><div class="inp-eye"><input id="mf2" type="password" autocomplete="off"><button class="eye-btn" type="button" onclick="toggleInp(\'mf2\', this)"><i class="icon" style="font-size:20px">visibility</i></button></div>' : '') + '<div class="acts"><button class="btn g" onclick="pend=null;closeS()">Cancelar</button><button class="btn" onclick="doUnlock()">Continuar</button></div><p id="msg" style="margin-top:10px;color:var(--bad)"></p>');
}
async function doUnlock(){
  var p = $('#mf1').value; if (!p) { say('Escribe tu clave.'); return; }
  try {
    if (!S.vault) { if (p.length < 6 || p !== $('#mf2').value) { say('Mínimo 6 caracteres y repítela igual.'); return; } var salt = b64(crypto.getRandomValues(new Uint8Array(16))); KEY_CRYPTO = await derive(p, salt); S.vault = { salt: salt, check: await enc('ok') }; save(); }
    else { KEY_CRYPTO = await derive(p, S.vault.salt); if (await dec(S.vault.check) !== 'ok') throw 0; }
  } catch (e) { KEY_CRYPTO = null; say('Clave incorrecta.'); return; }
  var f = pend; pend = null; closeS(); if (f) f();
}
function showPw(id){ var fill = function(){ dec(findAcc(id).pw).then(function(t){ var e = $('#f5'); e.value = t; e.type = 'text'; }); }; if (KEY_CRYPTO) fill(); else withKey(function(){ editAcc(id); fill(); }); }

/* PUBLICAR PORTAL DEL CLIENTE EN FIRESTORE */
function openPortalPublish(gi){
  var g = CL[gi]; if (!g) return;
  var key = g.name.toLowerCase();
  var savedUid = (S.portalMap && S.portalMap[key]) || '';
  openS('<h2>Portal Web — ' + esc(g.name) + '</h2>' +
    '<p>Vincula el UID que creaste para este cliente en Firebase Authentication para que pueda iniciar sesión y ver su estado de cuenta.</p>' +
    '<label>UID del cliente en Firebase</label><input id="pUid" value="' + esc(savedUid) + '" placeholder="Pega aquí el UID del cliente">' +
    '<label class="chk"><input type="checkbox" id="pIncPw" checked> Publicar también sus correos y contraseñas</label>' +
    '<div class="acts"><button class="btn g" onclick="closeS()">Cancelar</button><button class="btn" onclick="publishPortal(' + gi + ')"><i class="icon">cloud_upload</i> Publicar portal</button></div>');
}

async function publishPortal(gi){
  if (!FB_READY || USER_ROLE !== 'admin') { toast('Inicia sesión como Admin con Firebase para publicar'); return; }
  var clientUid = ($('#pUid').value || '').trim();
  if (!clientUid) { toast('Pega el UID del cliente'); return; }
  var incPw = $('#pIncPw').checked;
  var g = CL[gi], d = cliData(g);

  if (incPw) {
    var needsKey = d.rows.some(function(r){ return r.mode !== 'fam' && r.hasPw; });
    if (needsKey && !KEY_CRYPTO) { withKey(function(){ openPortalPublish(gi); }); return; }
    for (var i = 0; i < d.rows.length; i++) {
      var r = d.rows[i];
      if (r.mode !== 'fam' && r.hasPw) {
        var c = findAcc(r.cid);
        if (c && c.pw) r.pw = await dec(c.pw);
      }
    }
  }
  if (!S.portalMap) S.portalMap = {};
  S.portalMap[g.name.toLowerCase()] = clientUid;
  save();

  try {
    await db.collection('portal').doc(clientUid).set(Object.assign({}, d, { updatedAt: Date.now() }));
    closeS(); toast('Portal del cliente actualizado en la nube');
  } catch (e) {
    toast('Error al publicar: revisa tus reglas de Firestore');
  }
}

      }).join('') +
      '<div class="grid-2" style="margin-top:10px">' +
        '<button class="btn" onclick="ticketCli(' + gi + ')"><i class="icon">receipt</i> Estado de cuenta</button>' +
        '<button class="btn g" onclick="openPortalPublish(' + gi + ')"><i class="icon">public</i> Portal Web</button>' +
      '</div></div>';
  }).join('');
}

function cliData(g){
  var pastDebt = 0, curDue = 0;
  var rows = g.it.map(function(x){
    var b = getBillingInfo(x.u); pastDebt += b.pastDebt; curDue += b.curDue;
    return { cid: x.c.id, svc: x.c.name, pfl: x.u.pfl || '', pin: x.u.pin || '', amt: +x.u.amount || 0, pastDebt: b.pastDebt, curDue: b.curDue, totalPay: b.totalPay, pastStr: b.pastMonths.map(monthLabel).join(', '), statusText: b.statusText, shortStatus: b.shortStatus, badgeCls: b.badgeCls, nextCycleText: b.nextCycleText, isUpToDate: b.isUpToDate, paused: !!x.u.paused, logo: x.c.logo || '', mode: x.c.mode || 'cred', login: x.c.login || '', hasPw: !!x.c.pw, pw: '' };
  });
  var s = S.settings || {};
  return { name: g.name, phone: g.phone || '', date: new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }), rows: rows, tot: g.tot, pastDebt: pastDebt, curDue: curDue, totalPay: pastDebt + curDue, incPw: false, owner: s.owner || '', bank: s.bank || '', clabe: s.clabe || '' };
}
function cliText(){
  var d = CT, lines = ['ESTADO DE CUENTA — Passly', 'Cliente: ' + d.name, 'Fecha: ' + d.date, '', 'Detalle de servicios:'];
  d.rows.forEach(function(r){ lines.push('• ' + r.svc + (r.pfl ? ' [' + r.pfl + ']' : '') + ': ' + (r.isUpToDate ? 'Al corriente — Siguiente ciclo: ' + r.nextCycleText : money(r.totalPay) + ' (' + r.statusText + ')')); });
  lines.push('', 'Saldo vencido anterior: ' + money(d.pastDebt), 'Ciclo actual (' + monthLabel(mk(today())) + '): ' + money(d.curDue), 'TOTAL A PAGAR: ' + (d.totalPay > 0 ? money(d.totalPay) : '$0 (Al corriente)'));
  if (d.incPw) {
    var creds = d.rows.filter(function(r){ return r.mode !== 'fam' && (r.login || r.pw); });
    if (creds.length) { lines.push('', 'Datos de acceso:'); creds.forEach(function(r){ lines.push('— ' + r.svc + ': ' + (r.login || '-') + (r.pw ? ' / ' + r.pw : '')); }); }
  }
  return lines.join('\n') + payInfo();
}
async function toggleCliPw(){
  var chk = $('#incCli'); if (!chk || !chk.checked) { CT.incPw = false; updateCliUI(); return; }
  for (var i = 0; i < CT.rows.length; i++) { var r = CT.rows[i]; if (r.mode !== 'fam' && r.hasPw && !r.pw) { var c = findAcc(r.cid); if (c && c.pw) r.pw = await dec(c.pw); } }
  CT.incPw = true; updateCliUI();
}
function updateCliUI(){ var a = $('#waCli'); if (a && CT.phone) a.href = waLink(CT.phone, cliText()); }
function ticketCli(i){
  var g = CL[i]; if (!g) return; CT = cliData(g); CI = i; var d = CT;
  var hasAnyCred = d.rows.some(function(r){ return r.mode !== 'fam' && (r.login || r.hasPw); });
  var needsUnlock = d.rows.some(function(r){ return r.mode !== 'fam' && r.hasPw; }) && !KEY_CRYPTO;
  var optCred = hasAnyCred ? (needsUnlock ? '<button class="mini" style="margin-top:12px" onclick="withKey(function(){ticketCli(' + i + ')})">Desbloquear para incluir contraseñas</button>' : '<label class="chk"><input type="checkbox" id="incCli" onchange="toggleCliPw()"> Incluir correos y contraseñas</label>') : '';
  openS('<h2>Estado de cuenta — ' + esc(d.name) + '</h2><div class="tkc">' + d.rows.map(function(r){ return '<div class="tr">' + badge({ logo: r.logo, name: r.svc }, 1) + '<div class="grow"><b>' + esc(r.svc) + '</b><small>' + esc(r.statusText) + '</small></div><div class="ta"><b>' + (r.isUpToDate ? '$0' : money(r.totalPay)) + '</b><span class="chip ' + r.badgeCls + '">' + esc(r.shortStatus) + '</span></div></div>'; }).join('') + '<div class="tt"><span>Saldo vencido anterior</span><b>' + money(d.pastDebt) + '</b></div><div class="tt"><span>Ciclo actual</span><b>' + money(d.curDue) + '</b></div><div class="tt total"><span>Total a pagar</span><b style="color:' + (d.totalPay > 0 ? 'var(--primary)' : 'var(--ok)') + '">' + (d.totalPay > 0 ? money(d.totalPay) : '$0 (Al corriente)') + '</b></div></div>' + optCred + '<div class="acts"><button class="btn g" onclick="copyTxt(cliText())"><i class="icon">content_copy</i> Copiar texto</button></div>' + (g.phone ? '<a class="btn w" id="waCli" target="_blank" rel="noopener" style="margin-top:10px;text-decoration:none;display:flex" href="' + waLink(g.phone, cliText()) + '"><i class="icon">chat</i> Enviar por WhatsApp</a>' : ''));
}
function ticketCliFor(cid, uid){ var c = findAcc(cid), u = c.users.filter(function(x){ return x.id === uid; })[0], k = u.name.trim().toLowerCase(); clients(); var idx = CL.findIndex(function(g){ return g.name.toLowerCase() === k; }); if (idx >= 0) ticketCli(idx); }

function sets(){
  var s = S.settings || {};
  return appLogo() + '<h1>Ajustes</h1><p>Datos de cobro, nube y sesión</p>' +
    '<div class="card" style="margin-top:16px"><label>Nombre del titular</label><input id="s1" value="' + esc(s.owner || '') + '"><label>Banco receptor</label><input id="s2" value="' + esc(s.bank || '') + '"><label>CLABE o tarjeta</label><input id="s3" inputmode="numeric" value="' + esc(s.clabe || '') + '"><button class="btn" style="width:100%;margin-top:18px" onclick="saveSets()"><i class="icon">save</i> Guardar datos de pago</button></div>' +
    '<div class="card"><button class="btn g" style="width:100%;margin-bottom:10px" onclick="openVault()"><i class="icon">lock_open</i> Bóveda de contraseñas</button><button class="btn g" style="width:100%;margin-bottom:10px" onclick="backup()"><i class="icon">cloud_sync</i> Respaldo JSON</button><button class="btn d" style="width:100%" onclick="doLogout()"><i class="icon">logout</i> Cerrar sesión</button></div>' +
    '<div style="text-align:center;padding:24px;color:var(--mu);font-size:12px">Passly v4.0 • Cloud Ready</div>';
}
function saveSets(){ S.settings = { owner: $('#s1').value.trim(), bank: $('#s2').value.trim(), clabe: $('#s3').value.trim() }; save(); toast('Ajustes guardados'); render(); }
function backup(){ openS('<h2>Respaldo JSON</h2><textarea id="bkText">' + esc(JSON.stringify(S)) + '</textarea><div class="acts"><button class="btn g" onclick="copyTxt($(\'#bkText\').value)">Copiar</button><button class="btn" onclick="imp()">Importar</button></div><p id="msg" style="margin-top:10px"></p>'); }
function imp(){ try { var d = JSON.parse($('#bkText').value); if (!d || !Array.isArray(d.accounts)) throw 0; S = d; S.lastBackup = Date.now(); save(); closeS(); render(); toast('Datos restaurados'); } catch (e) { say('JSON inválido'); } }

var SEL = '';
var PLAT = [['netflix','Netflix','#e50914','N'],['hbo','Max','#002be7','max'],['prime','Prime Video','#00a8e1','prime'],['disney','Disney+','#113ccf','D+'],['spotify','Spotify','#1db954','S'],['youtube','YouTube','#ff0033','▶'],['apple','Apple TV+','#2c2c31','tv+'],['paramount','Paramount+','#0064ff','P+'],['crunchy','Crunchyroll','#f47521','CR'],['vix','ViX','#ff6a00','ViX'],['canva','Canva','#00a7b0','C'],['google','Google One','#4285f4','1']];
function brand(l, n){ for (var i = 0; i < PLAT.length; i++) if (PLAT[i][0] === l) return { c: PLAT[i][2], t: PLAT[i][3] }; return { c: '#242424', t: (String(n||'?').trim().charAt(0).toUpperCase() || '?') }; }
function badge(c, sm){ var l = c.logo || ''; if (l.indexOf('data:') === 0) return '<img class="lg' + (sm ? ' sm' : '') + '" src="' + l + '" alt="">'; var b = brand(l, c.name); return '<span class="lg' + (sm ? ' sm' : '') + '" style="background:' + b.c + '">' + esc(b.t) + '</span>'; }
function platPicker(){ var h = '<div class="plat">'; PLAT.forEach(function(p){ h += '<button type="button" class="pb' + (SEL === p[0] ? ' on' : '') + '" onclick="pickP(\'' + p[0] + '\')"><span class="lg sm" style="background:' + p[2] + '">' + esc(p[3]) + '</span>' + esc(p[1]) + '</button>'; }); return h + '</div><div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="mini" onclick="document.getElementById(\'lf\').click()">Subir logo</button><button type="button" class="mini" onclick="pickP(\'\')">Quitar</button><input id="lf" type="file" accept="image/*" style="display:none" onchange="upLogo(this)"></div>'; }
function pickP(k){ SEL = k; var btns = document.querySelectorAll('.plat .pb'); for (var i = 0; i < btns.length; i++) btns[i].className = 'pb' + (PLAT[i][0] === k ? ' on' : ''); }
function upLogo(inp){ var f = inp.files && inp.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(){ var im = new Image(); im.onload = function(){ var c = document.createElement('canvas'); c.width = c.height = 96; var x = c.getContext('2d'), m = Math.min(im.width, im.height); x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, 96, 96); pickP(c.toDataURL('image/png')); toast('Logo listo'); }; im.src = r.result; }; r.readAsDataURL(f); }
function modeSw(){ var c = $('#cred'); if (c) c.style.display = $('#f12').value === 'fam' ? 'none' : ''; }

/* ARRANQUE CON FIREBASE AUTH */
if (FB_READY && auth) {
  auth.onAuthStateChanged(async function(user){
    CUR_USER = user;
    if (!user) { USER_ROLE = null; renderLogin(); return; }
    if (user.uid === ADMIN_UID) {
      USER_ROLE = 'admin';
      document.body.style.paddingBottom = '120px';
      $('#mainNav').style.display = 'flex';
      try {
        var doc = await db.collection('admin').doc('datos').get();
        if (doc.exists) { S = doc.data(); if (!S.portalMap) S.portalMap = {}; localStorage.setItem(KEY, JSON.stringify(S)); }
        else if (S.accounts && S.accounts.length) { save(); toast('Respaldo local subido a la nube'); }
      } catch (e) { console.error(e); }
      render();
    } else {
      USER_ROLE = 'client';
      try {
        var pdoc = await db.collection('portal').doc(user.uid).get();
        PORTAL_DATA = pdoc.exists ? pdoc.data() : null;
      } catch (e) { PORTAL_DATA = null; }
      renderClientPortal();
    }
  });
} else {
  renderLogin();
}

if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }); }
