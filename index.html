<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mis cuentas compartidas</title>
<style>
:root{--bg:#000;--s1:#0c0c0f;--s2:#17171c;--line:#25252c;--tx:#f2f2f5;--mu:#8d8d99;--ac:#f2b84b;--acx:#1a1405;--ok:#4fd6b8;--bad:#ff7a8a;--warn:#f2b84b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:88px}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.3px}
h2{font-size:18px;margin:0 0 12px}
p{margin:0;color:var(--mu)}
.top{display:flex;gap:8px;margin:16px 0}
.btn{flex:1;border:0;border-radius:14px;padding:13px 14px;font:600 15px system-ui,sans-serif;background:var(--ac);color:var(--acx)}
.btn.g{background:var(--s2);color:var(--tx)}
.btn.d{background:#3a1c27;color:var(--bad)}
.strip{display:flex;background:var(--s1);border-radius:16px;padding:14px 4px;margin-bottom:22px}
.strip div{flex:1;text-align:center;border-right:1px solid var(--line)}
.strip div:last-child{border:0}
.strip b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.strip small{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:14px;padding:12px;margin-bottom:8px}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small{color:var(--mu);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.chip.ok{background:#12332d;color:var(--ok)}
.chip.bad{background:#3a1c27;color:var(--bad)}
.chip.warn{background:#3a2e12;color:var(--warn)}
.mini{border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:10px;padding:8px 10px;font:600 13px system-ui,sans-serif}
.card{background:var(--s1);border-radius:20px 20px 20px 8px;padding:14px;margin-bottom:16px;border-left:4px solid var(--ac)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch .grow b{font-size:18px}
.card .row{background:var(--s2)}
.add{width:100%;border:1px dashed var(--line);background:transparent;color:var(--mu);border-radius:12px;padding:11px;font:600 14px system-ui,sans-serif}
.empty{background:var(--s1);border-radius:16px;padding:22px 16px;text-align:center}
.empty p{margin-bottom:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s1);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:transparent;color:var(--mu);font:600 12px system-ui,sans-serif;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--ac)}
#sheet{position:fixed;inset:0;display:none;z-index:20}
#sheet.on{display:block}
.bk{position:absolute;inset:0;background:#000b}
.pan{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:560px;max-height:88%;overflow:auto;background:var(--s1);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 6px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:16px system-ui,sans-serif}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{height:140px;font:12px ui-monospace,monospace}
.acts{display:flex;gap:8px;margin-top:18px}
.own{border-left:3px solid var(--ok)}
.tk{background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;font:14px/1.5 ui-monospace,monospace;user-select:text;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px;margin-top:14px}
.chk input{width:auto}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vault{background:var(--s2);border-radius:12px;padding:8px 10px;margin:0 0 10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.vr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vr code{font-family:ui-monospace,monospace;color:var(--ac)}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}
.btn.w{background:#4fd68a;color:#04210f}
.tkc{background:#000;border:1px solid var(--line);border-radius:20px 20px 20px 8px;padding:4px 14px;margin:12px 0 4px}
.tr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ta b{font-variant-numeric:tabular-nums}
.tt{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.tt span{color:var(--mu)}
.tt b{font-size:20px;font-variant-numeric:tabular-nums}
select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:16px system-ui,sans-serif}
.lg{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:700 16px system-ui,sans-serif;color:#fff;flex:none;object-fit:cover}
.lg.sm{width:34px;height:34px;border-radius:10px;font-size:13px}
.plat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px;font:600 13px system-ui,sans-serif;text-align:left}
.pb.on{border-color:var(--ac);background:#2a2208}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--s2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button id="n1" onclick="go('home')"><i>🏠</i>Inicio</button>
<button id="n2" onclick="go('accts')"><i>📇</i>Cuentas</button>
<button id="n3" onclick="go('clients')"><i>👥</i>Clientes</button>
<button id="n4" onclick="go('sets')"><i>⚙️</i>Ajustes</button>
</nav>
<div id="sheet"></div>
<script>
var KEY='subs-v1',S={accounts:[]},view='home';
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+(+n||0).toLocaleString('es-MX',{maximumFractionDigits:2})}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function mk(d){return d.getFullYear()+'-'+(d.getMonth()+1)}
function fmt(d){return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})}
function dueDate(y,m,day){var last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last))}
function info(u){var t=today(),paid=u.paidFor===mk(t),d=dueDate(t.getFullYear(),t.getMonth()+(paid?1:0),u.day);return{paid:paid,d:d,diff:Math.round((d-t)/864e5)}}
function chip(i){
if(i.paid)return '<span class="chip ok">Pagado</span>';
if(i.diff<0)return '<span class="chip bad">Vencido hace '+(-i.diff)+' d</span>';
if(i.diff===0)return '<span class="chip warn">Cobra hoy</span>';
return '<span class="chip '+(i.diff<=3?'warn':'')+'">En '+i.diff+' d</span>'}
function allUsers(){var a=[];S.accounts.forEach(function(c){c.users.forEach(function(u){a.push({c:c,u:u,i:info(u)})})});return a}
function urow(x,acc){var c=x.c,u=x.u,i=x.i;
return '<div class="row">'+(acc?badge(c,1):'')+'<div class="grow" onclick="editUser(\''+c.id+'\',\''+u.id+'\')"><b>'+esc(u.name)+'</b><small>'+(acc?'<span>'+esc(c.name)+'</span>':'')+'<span>'+money(u.amount)+'</span>'+(u.pfl?'<span>'+esc(u.pfl)+(u.pin?' PIN '+esc(u.pin):'')+'</span>':'')+'<span>'+(i.paid?'Próximo ':'Cobro ')+fmt(i.d)+'</span></small></div>'+chip(i)+'<button class="mini" onclick="pay(\''+c.id+'\',\''+u.id+'\')">'+(i.paid?'Deshacer':'Ya pagó')+'</button></div>'}
function home(){
var us=allUsers().sort(function(a,b){return a.i.d-b.i.d});
var tot=0,got=0;us.forEach(function(x){tot+=+x.u.amount||0;if(x.i.paid)got+=+x.u.amount||0});
var h='<h1>Bienvenido</h1><p>¿Qué hacemos hoy?</p><div class="top"><button class="btn" onclick="editAcc(\'\')">Nueva cuenta</button><button class="btn g" onclick="backup()">Respaldo</button></div>';
if(!S.accounts.length)return h+'<div class="empty"><p>Todavía no hay cuentas. Crea la primera y agrega a quienes la comparten.</p><button class="btn" onclick="editAcc(\'\')">Crear cuenta</button></div>';
h+='<div class="strip"><div><b>'+money(tot)+'</b><small>Al mes</small></div><div><b>'+money(got)+'</b><small>Cobrado</small></div><div><b>'+money(tot-got)+'</b><small>Pendiente</small></div></div>'+ownBlock(tot)+'<h2>Próximos cobros</h2>';
if(!us.length)return h+'<div class="empty"><p>Agrega usuarios a una cuenta para ver sus cobros aquí.</p></div>';
return h+us.map(function(x){return urow(x,true)}).join('')}
function accts(){
var h='<h1>Cuentas</h1><p>Toca el nombre para editarlo.</p><div class="top"><button class="btn" onclick="editAcc(\'\')">Nueva cuenta</button></div>';
if(!S.accounts.length)return h+'<div class="empty"><p>Aún no tienes cuentas.</p></div>';
return h+S.accounts.map(function(c){
var t=0;c.users.forEach(function(u){t+=+u.amount||0});
return '<div class="card"><div class="ch">'+badge(c)+'<div class="grow" onclick="editAcc(\''+c.id+'\')"><b>'+esc(c.name)+'</b><small><span>'+c.users.length+(c.users.length===1?' usuario':' usuarios')+'</span><span>'+money(t)+' al mes</span></small></div><button class="mini" onclick="editAcc(\''+c.id+'\')">Editar</button></div>'+
cinfo(c)+orow(c,false)+c.users.map(function(u){return urow({c:c,u:u,i:info(u)},false)}).join('')+
(c.users.length<(c.slots||4)?'<button class="add" onclick="editUser(\''+c.id+'\',\'\')">Agregar usuario</button>':'')+'</div>'}).join('')}
function render(){var f={home:home,accts:accts,clients:clients,sets:sets};$('#app').innerHTML=f[view]();['home','accts','clients','sets'].forEach(function(k,j){$('#n'+(j+1)).className=view===k?'on':''})}
function go(v){view=v;render();window.scrollTo(0,0)}
function openS(h){$('#sheet').innerHTML='<div class="bk" onclick="closeS()"></div><div class="pan">'+h+'</div>';$('#sheet').className='on'}
function closeS(){$('#sheet').className='';$('#sheet').innerHTML=''}
function sure(b,fn){if(!b.dataset.s){b.dataset.s=1;b.textContent='¿Seguro? Toca otra vez';return}fn()}
function findAcc(id){return S.accounts.filter(function(c){return c.id===id})[0]}
function pay(cid,id){var u=findAcc(cid).users.filter(function(x){return x.id===id})[0];u.paidFor=info(u).paid?null:mk(today());save();render()}
function editAcc(id){var c=findAcc(id),fam=c&&c.mode==='fam';SEL=c&&c.logo||'';
openS('<h2>'+(c?'Editar cuenta':'Nueva cuenta')+'</h2><label>Nombre de la cuenta</label><input id="f1" value="'+esc(c?c.name:'')+'" placeholder="Ej. Netflix 1"><label>Plataforma (opcional)</label>'+platPicker()+'<label>¿Cómo se comparte?</label><select id="f12" onchange="modeSw()"><option value="cred"'+(fam?'':' selected')+'>Con correo y contraseña</option><option value="fam"'+(fam?' selected':'')+'>Grupo familiar (sin contraseña)</option></select><div id="cred"'+(fam?' style="display:none"':'')+'><label>Usuario o correo de la cuenta</label><input id="f4" autocapitalize="none" value="'+esc(c&&c.login||'')+'"><label>Contraseña de la cuenta</label><div style="display:flex;gap:8px"><input id="f5" type="password" autocomplete="off" placeholder="'+(c&&c.pw?'Guardada. Escribe para cambiarla':'Se guarda cifrada')+'">'+(c&&c.pw?'<button class="mini" onclick="showPw(\''+id+'\')">Ver</button>':'')+'</div></div><label>Cuánto pago yo al mes</label><input id="f6" type="number" inputmode="decimal" value="'+(c&&c.cost||'')+'"><label>Día del mes en que yo pago (1 a 31)</label><input id="f7" type="number" inputmode="numeric" min="1" max="31" value="'+(c&&c.payDay||'')+'"><label>Límite de perfiles</label><input id="f9" type="number" inputmode="numeric" min="1" max="10" value="'+(c&&c.slots||4)+'"><label>Medio de pago</label><input id="f8" value="'+esc(c&&c.method||'')+'" placeholder="Ej. Tarjeta terminada en 4417"><div class="acts">'+(c?'<button class="btn d" onclick="sure(this,function(){delAcc(\''+id+'\')})">Eliminar</button>':'')+'<button class="btn" onclick="saveAcc(\''+id+'\')">Guardar</button></div>')}
function saveAcc(id){var v={name:$('#f1').value.trim()||'Cuenta',login:$('#f4').value.trim(),pw:$('#f12').value==='fam'?'':$('#f5').value,cost:parseFloat($('#f6').value)||0,payDay:Math.min(31,Math.max(0,parseInt($('#f7').value)||0)),method:$('#f8').value.trim(),slots:Math.min(10,Math.max(1,parseInt($('#f9').value)||4)),mode:$('#f12').value,logo:SEL};
function done(p){var c=findAcc(id);if(!c){c={id:uid(),users:[]};S.accounts.push(c)}c.name=v.name;c.login=v.login;c.cost=v.cost;c.payDay=v.payDay;c.method=v.method;c.slots=v.slots;c.mode=v.mode;c.logo=v.logo;if(p)c.pw=p;save();closeS();render()}
if(v.pw)withKey(function(){enc(v.pw).then(done)});else done(null)}
function delAcc(id){S.accounts=S.accounts.filter(function(c){return c.id!==id});save();closeS();render()}
function editUser(cid,id){var c=findAcc(cid),u=id?c.users.filter(function(x){return x.id===id})[0]:null;
openS('<h2>'+(u?'Editar usuario':'Nuevo usuario')+'</h2><label>Nombre</label><input id="f1" value="'+esc(u?u.name:'')+'" placeholder="Nombre del cliente"><label>WhatsApp (10 dígitos, opcional)</label><input id="f9" type="tel" inputmode="numeric" value="'+esc(u&&u.phone||'')+'"><div class="grid-2"><div><label>Nombre de su perfil</label><input id="f10" value="'+esc(u&&u.pfl||'')+'" placeholder="Perfil 2"></div><div><label>PIN, si tiene</label><input id="f11" inputmode="numeric" value="'+esc(u&&u.pin||'')+'"></div></div><label>Cuánto paga al mes</label><input id="f2" type="number" inputmode="decimal" value="'+(u?u.amount:'')+'" placeholder="0"><label>Día del mes en que se cobra (1 a 31)</label><input id="f3" type="number" inputmode="numeric" min="1" max="31" value="'+(u?u.day:'')+'" placeholder="1">'+(u?'<button class="btn g" style="width:100%;margin-top:16px" onclick="ticket(\''+cid+'\',\''+id+'\')">Ticket de este servicio</button><button class="btn" style="width:100%;margin-top:8px" onclick="ticketCliFor(\''+cid+'\',\''+id+'\')">Ticket con todos sus servicios</button>':'')+'<div class="acts">'+(u?'<button class="btn d" onclick="sure(this,function(){delUser(\''+cid+'\',\''+id+'\')})">Eliminar</button>':'')+'<button class="btn" onclick="saveUser(\''+cid+'\',\''+id+'\')">Guardar</button></div>')}
function saveUser(cid,id){var c=findAcc(cid),n=$('#f1').value.trim()||'Usuario',a=parseFloat($('#f2').value)||0,d=Math.min(31,Math.max(1,parseInt($('#f3').value)||1));
var u=id?c.users.filter(function(x){return x.id===id})[0]:null;
var x={name:n,amount:a,day:d,phone:$('#f9').value.replace(/\D/g,''),pfl:$('#f10').value.trim(),pin:$('#f11').value.trim()};if(u)Object.assign(u,x);else c.users.push(Object.assign({id:uid(),paidFor:null},x));save();closeS();render()}
function delUser(cid,id){var c=findAcc(cid);c.users=c.users.filter(function(x){return x.id!==id});save();closeS();render()}
function backup(){openS('<h2>Respaldo</h2><p>Tus datos viven solo en este navegador. Copia este texto y guárdalo en un lugar seguro. Para restaurar, pega uno aquí y toca Importar.</p><label>Datos</label><textarea id="bk">'+esc(JSON.stringify(S))+'</textarea><div class="acts"><button class="btn g" onclick="closeS()">Cerrar</button><button class="btn" onclick="imp()">Importar</button></div><p id="msg" style="margin-top:10px"></p>')}
function imp(){try{var d=JSON.parse($('#bk').value);if(!d||!Array.isArray(d.accounts))throw 0;S=d;save();closeS();render()}catch(e){$('#msg').textContent='No se pudo importar. Revisa que el texto esté completo.'}}
var KEY=null,pend=null,TK='',TB='';
function b64(u){return btoa(String.fromCharCode.apply(null,u))}
function ub(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function derive(pw,salt){var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(salt),iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(t){var iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,new TextEncoder().encode(t));return b64(iv)+'.'+b64(new Uint8Array(c))}
async function dec(s){var p=s.split('.'),d=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(p[0])},KEY,ub(p[1]));return new TextDecoder().decode(d)}
function say(t){$('#msg').textContent=t}
function withKey(fn){if(KEY){fn();return}pend=fn;var n=!S.vault;
openS('<h2>'+(n?'Crea tu clave maestra':'Desbloquear contraseñas')+'</h2><p>'+(n?'Protege tus contraseñas guardadas. Si la olvidas, no se pueden recuperar.':'Escribe tu clave maestra.')+'</p><label>Clave maestra</label><input id="f1" type="password" autocomplete="off">'+(n?'<label>Repite la clave</label><input id="f2" type="password" autocomplete="off">':'')+'<div class="acts"><button class="btn g" onclick="pend=null;closeS()">Cancelar</button><button class="btn" onclick="doUnlock()">Continuar</button></div><p id="msg" style="margin-top:10px;color:var(--bad)"></p>')}
async function doUnlock(){var p=$('#f1').value;if(!p){say('Escribe tu clave.');return}
try{if(!S.vault){if(p.length<6||p!==$('#f2').value){say('Usa al menos 6 caracteres y repítela igual.');return}
var salt=b64(crypto.getRandomValues(new Uint8Array(16)));KEY=await derive(p,salt);S.vault={salt:salt,check:await enc('ok')};save()}
else{KEY=await derive(p,S.vault.salt);if(await dec(S.vault.check)!=='ok')throw 0}}
catch(e){KEY=null;say('Clave incorrecta.');return}
var f=pend;pend=null;closeS();if(f)f()}
function showPw(id){var fill=function(){dec(findAcc(id).pw).then(function(t){var e=$('#f5');e.value=t;e.type='text'})};if(KEY)fill();else withKey(function(){editAcc(id);fill()})}
function ochip(i){if(i.paid)return '<span class="chip ok">Activa</span>';if(i.diff<0)return '<span class="chip bad">Vencida</span>';if(i.diff<=3)return '<span class="chip warn">'+(i.diff===0?'Vence hoy':'Por vencer')+'</span>';return '<span class="chip ok">Activa</span>'}
function orow(c,nm){if(!c.payDay)return '';var i=info({day:c.payDay,paidFor:c.paidFor});
return '<div class="row own">'+(nm?badge(c,1):'')+'<div class="grow" onclick="editAcc(\''+c.id+'\')"><b>'+(nm?esc(c.name):'Mi pago')+'</b><small><span>'+money(c.cost)+'</span><span>'+(i.paid?'Próximo ':'Vence ')+fmt(i.d)+'</span>'+(c.method?'<span>'+esc(c.method)+'</span>':'')+'</small></div>'+ochip(i)+'<button class="mini" onclick="payOwn(\''+c.id+'\')">'+(i.paid?'Deshacer':'Ya pagué')+'</button></div>'}
function cinfo(c){var n=c.users.length,m=c.slots||4,h='';
if((c.login||c.pw)&&c.mode!=='fam')h='<div class="vault">'+(c.login?'<div class="vr"><span>👤 <code>'+esc(c.login)+'</code></span><button class="mini" onclick="copyLogin(\''+c.id+'\')">Copiar</button></div>':'')+(c.pw?'<div class="vr"><span>🔑 <code id="pw-'+c.id+'">••••••••</code></span><span><button class="mini" onclick="pwView(\''+c.id+'\')">Ver</button> <button class="mini" onclick="pwCopy(\''+c.id+'\')">Copiar</button></span></div>':'')+'</div>';
return h+(c.mode==='fam'?'<p style="margin:0 0 8px"><span class="chip">Grupo familiar, sin contraseña</span></p>':'')+'<p style="font-size:13px;margin:0 0 10px">Perfiles '+n+' de '+m+(n>=m?' (llena)':', '+(m-n)+' libres')+'</p>'}

if(d.ven){x.textAlign='left';x.fillStyle='#8d8d99';x.font='22px '+F;x.fillText('De eso, ya vencido',P,y+128);x.textAlign='right';x.fillStyle='#ff7a8a';x.font='700 26px '+F;x.fillText(money(d.ven),W-P,y+128);y+=48}
y+=116;

if(pay.length){x.fillStyle='#25252c';x.fillRect(P,y,W-2*P,2);y+=44;x.textAlign='left';x.fillStyle='#f2b84b';x.font='600 22px '+F;x.fillText('Datos para pagar',P,y);

var o=document.createElement('canvas');o.width=W;o.height=y;var q=o.getContext('2d');q.fillStyle='#000';q.fillRect(0,0,W,y);q.drawImage(t,0,0);
